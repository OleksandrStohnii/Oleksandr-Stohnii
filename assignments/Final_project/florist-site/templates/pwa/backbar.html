<style>
    .appbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 150; gap: 10px; justify-content: center; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: rgba(247,241,234,.96); backdrop-filter: blur(10px); border-top: 1px solid #E6D5BE; }
    .appbar a, .appbar button { font-family: 'Montserrat', Arial, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #1E2A4A; background: #fff; border: 1px solid #1E2A4A; border-radius: 999px; padding: 11px 20px; text-decoration: none; cursor: pointer; }
    .appbar a.main { background: #9C7A6B; border-color: #9C7A6B; color: #fff; }
    html.is-app .appbar { display: flex; }
    html.is-app body { padding-bottom: calc(80px + env(safe-area-inset-bottom)) !important; }
    html.is-app .mobile-cta { bottom: calc(84px + env(safe-area-inset-bottom)) !important; }
    html.is-app #content, html.is-app .main { padding-bottom: 20px; }
</style>
<nav class="appbar" aria-label="Навігація застосунку">
    <button type="button" onclick="history.back()">&larr; Назад</button>
    <a class="main" href="{% url 'panel' %}">Панель</a>
    <a href="{% url 'home' %}">Сайт</a>
</nav>
<script>
    (function () {
        var app = window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        if (app) { document.documentElement.classList.add('is-app'); }
    })();
</script>
