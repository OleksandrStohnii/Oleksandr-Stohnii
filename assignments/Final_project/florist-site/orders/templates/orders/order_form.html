<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Залишити заявку — Zolotaya</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --mocha: #9C7A6B; --mocha-dark: #7D5F52; --navy: #1E2A4A; --sand: #E6D5BE; --blush: #EAD7CD; --milk: #F7F1EA; --muted: #5E6578; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; background: linear-gradient(135deg, var(--blush) 0%, var(--milk) 55%); color: var(--navy); font-family: 'Inter', Arial, sans-serif; font-weight: 300; }
        a { color: inherit; text-decoration: none; }
        .container { max-width: 620px; margin: 0 auto; padding: 0 20px 48px; }
        .top { padding: 28px 0 8px; text-align: center; }
        .logo { font-family: 'Jost', sans-serif; font-size: 22px; font-weight: 500; letter-spacing: .4em; text-transform: uppercase; color: var(--mocha); }
        .tagline { font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: .38em; color: var(--mocha); margin-top: 8px; }
        .box { background: #fff; border: 1px solid var(--sand); border-radius: 28px; padding: 40px 36px; margin-top: 28px; box-shadow: 0 14px 40px rgba(30,42,74,.08); }
        h1 { font-family: 'Jost', sans-serif; font-size: 26px; font-weight: 300; letter-spacing: .14em; text-transform: uppercase; margin: 0 0 12px; }
        h1::after { content: ""; display: block; width: 56px; height: 1px; background: var(--mocha); margin-top: 14px; }
        .lead { color: var(--muted); line-height: 1.6; margin: 0 0 28px; }
        .field { margin-bottom: 20px; }
        label { display: block; font-family: 'Jost', sans-serif; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 8px; color: var(--mocha-dark); }
        input, select, textarea { width: 100%; padding: 14px 16px; font-size: 16px; font-family: inherit; color: var(--navy); background: var(--milk); border: 1px solid var(--sand); border-radius: 14px; outline: none; transition: border-color .2s, box-shadow .2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--mocha); box-shadow: 0 0 0 3px rgba(156,122,107,.15); }
        .errorlist { color: #A8392F; font-size: 14px; list-style: none; padding: 0; margin: 6px 0 0; }
        button { width: 100%; margin-top: 8px; background: var(--mocha); color: #fff; border: 0; padding: 18px; border-radius: 999px; font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: .18em; text-transform: uppercase; cursor: pointer; box-shadow: 0 8px 22px rgba(156,122,107,.3); transition: background .2s, transform .2s; }
        button:hover { background: var(--mocha-dark); transform: translateY(-2px); }
        .back { display: block; text-align: center; margin-top: 22px; color: var(--muted); font-size: 14px; }
        .back:hover { color: var(--mocha); }
        @media (max-width: 600px) { .box { padding: 28px 22px; } h1 { font-size: 22px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="top">
            <a class="logo" href="/">Zolotaya</a>
            <div class="tagline">beauty in details</div>
        </div>

        <div class="box">
            <h1>Залишити заявку</h1>
            <p class="lead">Розкажіть про свою подію, і я зв’яжуся з вами, щоб обговорити деталі та вартість.</p>

            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="field">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {{ field.errors }}
                    </div>
                {% endfor %}
                <button type="submit">Відправити заявку</button>
            </form>
        </div>

        <a class="back" href="/">← Повернутися на головну</a>
    </div>
</body>
</html>
