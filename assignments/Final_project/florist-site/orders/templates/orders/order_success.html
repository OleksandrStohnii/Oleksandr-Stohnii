<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Дякуємо — Zolotaya</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --mocha: #9C7A6B; --mocha-dark: #7D5F52; --navy: #1E2A4A; --sand: #E6D5BE; --blush: #EAD7CD; --milk: #F7F1EA; --muted: #5E6578; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, var(--blush) 0%, var(--milk) 55%); color: var(--navy); font-family: 'Inter', Arial, sans-serif; font-weight: 300; padding: 20px; }
        a { color: inherit; text-decoration: none; }
        .box { max-width: 520px; width: 100%; background: #fff; border: 1px solid var(--sand); border-radius: 28px; padding: 56px 36px; text-align: center; box-shadow: 0 14px 40px rgba(30,42,74,.08); }
        .logo { font-family: 'Jost', sans-serif; font-size: 20px; font-weight: 500; letter-spacing: .4em; text-transform: uppercase; color: var(--mocha); }
        .mark { width: 64px; height: 64px; margin: 28px auto 20px; border-radius: 50%; border: 1px solid var(--mocha); color: var(--mocha); display: flex; align-items: center; justify-content: center; font-size: 28px; }
        h1 { font-family: 'Jost', sans-serif; font-size: 26px; font-weight: 300; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 12px; }
        p { color: var(--muted); line-height: 1.6; margin: 0 0 32px; }
        .btn { display: inline-block; background: var(--mocha); color: #fff; padding: 16px 32px; border-radius: 999px; font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; box-shadow: 0 8px 22px rgba(156,122,107,.3); transition: background .2s, transform .2s; }
        .btn:hover { background: var(--mocha-dark); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">Zolotaya</div>
        <div class="mark">✓</div>
        <h1>Дякуємо за заявку</h1>
        <p>Я зв’яжуся з вами найближчим часом, щоб обговорити деталі вашої події.</p>
        <a class="btn" href="/">На головну</a>
    </div>
{% include "pwa/backbar.html" %}
</body>
</html>
