// Ответ сервера с ошибкой («не тот год», «нет прав») — это НЕ потеря связи:
// раньше такие ответы считались обрывом, и после четырёх приложение тихо
// переставало сохранять что-либо. Теперь обрыв — только когда сервер молчит.
function srv(path,data,ok,bad){
  if(!SRV)return;
  SRV.post(path,data).then(j=>{
    if(!j){SRVERR++;netBar();if(bad)bad({error:'net'});return}
    SRVERR=0;netBar();
    if(j.error){if(bad)bad(j);return}
    if(ok)ok(j);
  }).catch(()=>{SRVERR++;netBar();if(bad)bad({error:'net'})});
}
// Полоска «нет связи»: человек видит, почему ничего не сохраняется
function netBar(){
  let e=$('netbar');
  if(!e){e=document.createElement('div');e.id='netbar';e.className='netbar';e.onclick=()=>{SRVERR=0;netBar();srvPull()};document.body.appendChild(e)}
  const off=SRV&&SRVERR>=4;
  e.hidden=!off;if(off)e.textContent=t('net_off');
}

// ---------- быстрый тикер: цена выбранной монеты прямо с биржи ----------
// Агрегаторы на бесплатном тарифе обновляют цены раз в минуту. Поэтому для той
// монеты, на которую игрок сейчас смотрит, берём цену с публичного тикера биржи:
// без ключа, каждые 3 секунды. Биржи пробуем по очереди; если ни одна не отвечает
// или у монеты нет пары к USDT, остаётся обычный минутный курс.
const TICK=[
  {n:'binance',u:s=>'https://api.binance.com/api/v3/ticker/24hr?symbol='+s+'USDT',
   g:j=>({p:+j.lastPrice,hi:+j.highPrice,lo:+j.lowPrice,d:+j.priceChangePercent})},
  {n:'okx',u:s=>'https://www.okx.com/api/v5/market/ticker?instId='+s+'-USDT',
   g:j=>{const x=((j.data||[])[0])||{},o=+x.open24h;return{p:+x.last,hi:+x.high24h,lo:+x.low24h,d:o>0?(+x.last-o)/o*100:null}}},
  {n:'bybit',u:s=>'https://api.bybit.com/v5/market/tickers?category=spot&symbol='+s+'USDT',
   g:j=>{const x=(((j.result||{}).list||[])[0])||{};return{p:+x.lastPrice,hi:+x.highPrice24h,lo:+x.lowPrice24h,d:x.price24hPcnt==null?null:+x.price24hPcnt*100}}}
];
let TKi=0,TKfail=0,TKno={},TKbusy=false,TKn=0;
function tick(){
  if(!LIVE||TKbusy||TKi>=TICK.length)return;
  if(typeof document!=='undefined'&&document.hidden)return;
  const c=coin(S.pred?S.pred.sym:S.coin),s=c.s;
  ++TKn;if(CNDkey!==ckey()||TKn%10===1)pullCandles();
  if(TKno[s])return;
  const src=TICK[TKi];TKbusy=true;
  fetch(src.u(s)).then(r=>{
    if(r.status===400||r.status===404){TKno[s]=1;throw 'nopair'}
    if(!r.ok)throw 0;
    return r.json()
  }).then(j=>{
    const q=src.g(j)||{},p=q.p;
    if(!(p>0)){TKno[s]=1;return}
    TKfail=0;
    if(!(c.p>0)||Math.abs(p-c.p)/c.p>.5)return; // отсекаем мусор и чужие пары
    c.p=p;if(c.h.length)c.h[c.h.length-1]=p;
    if(q.hi>0&&q.lo>0){c.hi24=q.hi;c.lo24=q.lo}
    if(q.d!=null&&isFinite(q.d))c.d=q.d;
    const K=candles(c.s);
    if(K&&K.length){const k=K[K.length-1];k.c=p;if(p>k.h)k.h=p;if(p<k.l)k.l=p}
    draw();
  }).catch(e=>{
    if(e!=='nopair'&&++TKfail>=3){TKfail=0;TKi++;TKno={}}
  }).then(()=>{TKbusy=false},()=>{TKbusy=false});
}

// Биржи отдают готовые свечи бесплатно и без ключа. Берём 90 штук на выбранном
// таймфрейме; последнюю свечу дотягиваем живой ценой из тикера.
// подпись, интервал Binance, бар OKX, интервал Bybit
const TFS=[['1m','1m','1m','1','1m'],['3m','3m','3m','3',null],['5m','5m','5m','5','5m'],['15m','15m','15m','15','15m'],['30m','30m','30m','30','30m'],
  ['1H','1h','1H','60','1h'],['2H','2h','2H','120',null],['4H','4h','4H','240',null],['6H','6h','6H','360','6h'],['12H','12h','12H','720','12h'],

// Прокрутка графика назад во времени.

  {u:(s,i)=>'https://api.binance.com/api/v3/klines?symbol='+s+'USDT&interval='+TFS[i][1]+'&limit=300',
   o:(s,i,e)=>'https://api.binance.com/api/v3/klines?symbol='+s+'USDT&interval='+TFS[i][1]+'&limit=500&endTime='+e,
   g:j=>(j||[]).map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}))},
  {u:(s,i)=>'https://www.okx.com/api/v5/market/candles?instId='+s+'-USDT&bar='+TFS[i][2]+'&limit=300',
   o:(s,i,e)=>'https://www.okx.com/api/v5/market/history-candles?instId='+s+'-USDT&bar='+TFS[i][2]+'&limit=100&after='+e,
   g:j=>((j||{}).data||[]).map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]})).reverse()},
  {u:(s,i)=>'https://api.bybit.com/v5/market/kline?category=spot&symbol='+s+'USDT&interval='+TFS[i][3]+'&limit=300',
   o:(s,i,e)=>'https://api.bybit.com/v5/market/kline?category=spot&symbol='+s+'USDT&interval='+TFS[i][3]+'&limit=200&end='+e,
   g:j=>((((j||{}).result||{}).list)||[]).map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]})).reverse()}
];
// Глубокая история. На Binance пара BTC/USDT появилась только в 2017 году, а на
// Bitfinex торги в долларах идут с 2013-го. Поэтому, когда биржа говорит «раньше
// ничего нет», доспрашиваем Bitfinex — там находится 2014-й и 2015-й.
const DEEP={
  ok:i=>!!TFS[i][4],
  // Короткие тикеры пишутся tBTCUSD, длинные — через двоеточие: tSHIB:USD
  pair:s=>'t'+s+(s.length>3?':':'')+'USD',
  u:(s,i,e)=>'https://api-pub.bitfinex.com/v2/candles/trade:'+TFS[i][4]+':'+DEEP.pair(s)+'/hist?limit=1000&end='+e,
  // Bitfinex отдаёт [время, открытие, закрытие, максимум, минимум, объём]
  // и сортирует от новых к старым — переворачиваем
  g:j=>(j||[]).map(k=>({t:+k[0],o:+k[1],c:+k[2],h:+k[3],l:+k[4],v:+k[5]})).reverse()
};
function ckey(){return (S.pred?S.pred.sym:S.coin)+'|'+TF}
function candles(sym){return CND&&CNDkey===ckey()&&CNDkey.indexOf(sym+'|')===0?CND:null}
const okCandle=x=>x.o>0&&x.h>0&&x.l>0&&x.c>0;
// Склейка: старое слева, свежее справа, без повторов по времени
function merge(old,fresh){
  if(!old||!old.length)return fresh;
  if(!fresh||!fresh.length)return old;
  const cut=fresh[0].t,head=old.filter(x=>x.t<cut);
  return head.concat(fresh);
}
function pullCandles(){
  if(!LIVE||CNDbusy||CNDsrc>=CSRC.length)return;
  const key=ckey(),s=key.split('|')[0];
  if(CNDno[key])return;
  const src=CSRC[CNDsrc];CNDbusy=true;
  fetch(src.u(s,TF)).then(r=>{
    if(r.status===400||r.status===404){CNDno[key]=1;throw 'nopair'}
    if(!r.ok)throw 0;
    return r.json()
  }).then(j=>{
    const k=(src.g(j)||[]).filter(okCandle);
    if(k.length<3){CNDno[key]=1;return}
    CNDfail=0;
    // Если игрок уже отлистал назад, свежие свечи просто дописываем справа,
    // а поднятую из прошлого историю не выбрасываем.
    CND=(CNDkey===key)?merge(CND,k):k;
    if(CNDkey!==key){CNDkey=key;VOFF=0;CNDtop=false}
    draw();
  }).catch(e=>{
    if(e!=='nopair'&&++CNDfail>=3){CNDfail=0;CNDsrc++;CNDno={}}
  }).then(()=>{CNDbusy=false},()=>{CNDbusy=false});
}
// Догрузка прошлого: вызывается, когда игрок долистал до левого края
function pullOlder(){
  if(!LIVE||OLDbusy||CNDtop||!CND||!CND.length)return Promise.resolve(false);
  const key=ckey();if(key!==CNDkey)return Promise.resolve(false);
  const s=key.split('|')[0],first=CND[0].t,src=CSRC[CNDsrc];
  OLDbusy=true;
  const take=arr=>{
    const k=(arr||[]).filter(okCandle).filter(x=>x.t<first);
    if(!k.length)return false;
    if(ckey()!==key)return true;
    CND=k.concat(CND);VOFF+=0;draw();return true;
  };
  const deep=()=>{
    if(!DEEP.ok(TF)){CNDtop=true;return Promise.resolve()}
    return fetch(DEEP.u(s,TF,first-1)).then(r=>r.ok?r.json():[]).then(j=>{
      if(!take(DEEP.g(j)))CNDtop=true;
    }).catch(()=>{CNDtop=true});
  };
  return (src.o?fetch(src.o(s,TF,first-1)).then(r=>r.ok?r.json():[]).then(j=>{
    if(!take(src.g(j)))return deep();
  }).catch(()=>deep()):deep())
  .then(()=>{OLDbusy=false;return !CNDtop},()=>{OLDbusy=false;return false});
}
// «Всё»: тянем прошлое страницами, пока биржи не скажут «раньше ничего нет»,
// и показываем всю историю монеты на одном экране.
let ALLbusy=false;
function loadAll(){
  if(ALLbusy||!CND)return;
  ALLbusy=true;renderNav();
  const key=ckey();
  const step=(n)=>{
    if(n<=0||CNDtop||ckey()!==key)return Promise.resolve();
    return pullOlder().then(more=>more?step(n-1):undefined);
  };
  step(25).then(()=>{
    ALLbusy=false;
    if(ckey()!==key)return;
    VN=Math.max(VMIN,CND.length);VOFF=0;draw();renderNav();
  },()=>{ALLbusy=false;renderNav()});
}
function renderTF(){

  try{const b=e.children[TF];if(b&&b.scrollIntoView)b.scrollIntoView({block:'nearest',inline:'center'})}catch(err){}
}
function setTF(i){if(i===TF||!TFS[i])return;TF=i;S.tf=i;save();CND=null;CNDkey='';VOFF=0;CNDtop=false;renderTF();pullCandles();draw();renderNav()}
// Видимый кусок графика. Если игрок не листал, это просто последние VN свечей.
function view(K){
  if(!K||!K.length)return K||[];
  const n=Math.min(VN,K.length),end=Math.max(n,K.length-VOFF);

const cv=$('cv'),cx=cv.getContext('2d');
// При увеличенном тексте экран масштабируется целиком, и видимый размер
// холста больше, чем тот, в котором мы рисуем. Учитываем масштаб, иначе
// линия графика обрывалась на трёх четвертях ширины.
function fit(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;
  const lw=cv.clientWidth||r.width,lh=cv.clientHeight||r.height;
  const zx=lw?r.width/lw:1,zy=lh?r.height/lh:1;
  cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);cx.setTransform(d*zx,0,0,d*zy,0,0);
  if(typeof COINS!=='undefined')draw()}

let CV={up:'#4fd18b',down:'#e5566b',gold:'#d4af5f',muted:'#9b978e',text:'#f3f0e8'};

  try{const cs=getComputedStyle(document.body);for(const k in CV){const v=cs.getPropertyValue('--'+k).trim();if(v)CV[k]=v}}catch(e){}
  // Цвет шапки телефона берём из самой темы, чтобы не держать список вручную

function pline(Y,w,v,cl,tx){const y=Y(v);cx.setLineDash([4,4]);cx.strokeStyle=cl;cx.lineWidth=1;cx.beginPath();cx.moveTo(0,y);cx.lineTo(w,y);cx.stroke();cx.setLineDash([]);cx.fillStyle=cl;cx.font='500 11px Onest,system-ui';cx.fillText(tx,4,y-3)}
function drawLine(c,pr,w,h){
  const H=c.h;if(!H||H.length<2)return;
  let mn=Math.min(...H),mx=Math.max(...H);
  if(pr){mn=Math.min(mn,pr.entry,pr.target||pr.entry);mx=Math.max(mx,pr.entry,pr.target||pr.entry)}
  const pad=(mx-mn)*.15||mx*.001;mn-=pad;mx+=pad;
  const X=i=>i/(H.length-1)*w,Y=v=>h-(v-mn)/(mx-mn)*h;
  const col=pr?((c.p-pr.entry)*pr.dir>=0?CV.up:CV.down):CV.gold;
  cx.beginPath();H.forEach((v,i)=>i?cx.lineTo(X(i),Y(v)):cx.moveTo(X(i),Y(v)));cx.strokeStyle=col;cx.lineWidth=2;cx.stroke();
  if(pr){pline(Y,w,pr.entry,CV.muted,t('start'));if(pr.target)pline(Y,w,pr.target,CV.text,t('target'))}
}
function drawCandles(c,pr,K,w,h,ALL){
  const vh=Math.round(h*.2),ch=h-vh-8;
  let mn=Infinity,mx=-Infinity,vm=0;
  for(const k of K){if(k.l<mn)mn=k.l;if(k.h>mx)mx=k.h;if(k.v>vm)vm=k.v}
  if(pr){mn=Math.min(mn,pr.entry,pr.target||pr.entry);mx=Math.max(mx,pr.entry,pr.target||pr.entry)}
  if(!(mx>mn)){const b=mn||1;mn=b*.999;mx=b*1.001}
  const pad=(mx-mn)*.06;mn-=pad;mx+=pad;
  const n=K.length,step=w/n,bw=Math.max(1,Math.min(9,step*.62)),Y=v=>ch-(v-mn)/(mx-mn)*ch;
  cx.strokeStyle=CV.muted;cx.globalAlpha=.12;cx.lineWidth=1;
  for(let i=1;i<4;i++){const y=Math.round(ch*i/4)+.5;cx.beginPath();cx.moveTo(0,y);cx.lineTo(w,y);cx.stroke()}
  cx.globalAlpha=1;
  drawScale(mn,mx,ch,w);
  if(vm>0){for(let i=0;i<n;i++){const k=K[i],x=i*step+step/2,bh=Math.max(1,k.v/vm*vh);
    cx.fillStyle=k.c>=k.o?CV.up:CV.down;cx.globalAlpha=.28;cx.fillRect(x-bw/2,h-bh,bw,bh)}cx.globalAlpha=1}
  for(let i=0;i<n;i++){const k=K[i],x=Math.round(i*step+step/2)+.5,col=k.c>=k.o?CV.up:CV.down;
    cx.strokeStyle=col;cx.fillStyle=col;cx.lineWidth=1;
    cx.beginPath();cx.moveTo(x,Y(k.h));cx.lineTo(x,Y(k.l));cx.stroke();
    const y1=Y(Math.max(k.o,k.c)),y2=Y(Math.min(k.o,k.c));

  drawMA(K,7,CV.gold,Y,step);drawMA(K,25,CV.muted,Y,step);
  if(atNow()){
    const ly=Y(c.p);

      cx.beginPath();cx.moveTo(0,ly+.5);cx.lineTo(w,ly+.5);cx.stroke();cx.setLineDash([]);cx.globalAlpha=1}
    if(pr){pline(Y,w,pr.entry,CV.muted,t('start'));if(pr.target)pline(Y,w,pr.target,CV.text,t('target'))}
  }

}
// Шкала цен справа: без чисел по графику не прочитать, сколько стоило
function drawScale(mn,mx,ch,w){
  cx.font='500 10px Onest,system-ui';cx.textAlign='right';cx.globalAlpha=.85;cx.fillStyle=CV.muted;
  for(let i=0;i<=4;i++){

// Подписи дат внизу графика: без них не понять, в каком году ты находишься
function drawDates(K,w,ch,step){

  const span=K[K.length-1].t-K[0].t,day=86400000;
  const fmt=span>400*day?(d=>d.getFullYear())

    :span>2*day?(d=>d.toLocaleDateString(undefined,{day:'numeric',month:'short'}))
    :(d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'));

// Перетаскивание графика пальцем или мышью
(function(){
  let dragX=null,base=0,moved=0;
  const stepNow=()=>{const K=view(CND&&CNDkey===ckey()?CND:null);return K&&K.length?cv.clientWidth/K.length:0};
  let dragY=null,vert=false;
  const down=e=>{const p=e.touches?e.touches[0]:e;dragX=p.clientX;dragY=p.clientY;base=VOFF;moved=0;vert=false};
  const move=e=>{
    if(dragX==null||vert)return;
    const p=e.touches?e.touches[0]:e,st=stepNow();
    if(!st)return;
    const dx=p.clientX-dragX,dy=p.clientY-dragY;
    moved=Math.max(moved,Math.abs(dx));
    if(moved<6){
      // Пока не ясно, листает человек график или крутит страницу — не мешаем ему
      if(Math.abs(dy)>8&&Math.abs(dy)>Math.abs(dx)){vert=true}
      return;
    }
    if(e.cancelable)e.preventDefault();
    const K=CND&&CNDkey===ckey()?CND:null;if(!K)return;
    VOFF=Math.max(0,Math.min(K.length-VMIN,Math.round(base+dx/st)));
    // подошли к левому краю загруженного — тянем ещё из прошлого
    if(K.length-VOFF-VN<30)pullOlder();
    draw();renderNav();
  };
  const up=()=>{dragX=null;dragY=null;vert=false};
  cv.addEventListener('touchstart',down,{passive:true});
  cv.addEventListener('touchmove',move,{passive:false});
  cv.addEventListener('touchend',up);cv.addEventListener('touchcancel',up);
  cv.addEventListener('mousedown',down);
  addEventListener('mousemove',move);addEventListener('mouseup',up);
  // колесо мыши и щипок — масштаб
  cv.addEventListener('wheel',e=>{
    if(!CND)return;
    e.preventDefault();
    VN=Math.max(VMIN,Math.min(VMAX,Math.round(VN*(e.deltaY>0?1.15:0.87))));

})();
function drawMA(K,p,col,Y,step){

  for(let i=0;i<K.length;i++){s+=K[i].c;if(i>=p)s-=K[i-p].c;if(i<p-1)continue;
    const x=i*step+step/2,y=Y(s/p);first?(cx.moveTo(x,y),first=false):cx.lineTo(x,y)}

}

// Нужен, чтобы человек видел свои вложения не только в долларах.
const FIATS=[['uah','₴'],['eur','€'],['pln','zł'],['try','₺'],['kzt','₸'],['usd','$']];
let FIAT={};
let USDC=null,FIATAT=0;
// Курсы берём у своего сервера: он раз в 3 минуты спрашивает CoinGecko за
// всех сразу (у телефона по отдельности CoinGecko часто упирается в лимит),
// а если тот молчит — Binance и курсы валют. Без сервера — CoinGecko напрямую.
let STABS={},FIATSRC='CoinGecko';
function pullFiat(){
  // API объявлен ниже, в части для Telegram: при первом запуске его ещё нет
  let apiU='';try{apiU=API?API+'/rates':''}catch(e){}
  const direct=()=>fetch('https://api.coingecko.com/api/v3/simple/price?ids=tether,usd-coin,dai,first-digital-usd,ethena-usde,paypal-usd&vs_currencies='+FIATS.map(x=>x[0]).join(','))
    .then(r=>{if(!r.ok)throw 0;return r.json()})
    .then(j=>{if(j&&j.tether){FIAT=j.tether;USDC=j['usd-coin']||null;
      STABS={USDT:j.tether,USDC:j['usd-coin'],DAI:j.dai,FDUSD:j['first-digital-usd'],USDe:j['ethena-usde'],PYUSD:j['paypal-usd']};
      FIATSRC='CoinGecko';FIATAT=Date.now();render()}}).catch(()=>{});
  if(!apiU){direct();return}
  fetch(apiU).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{

// Бегущая строка курсов. Только то, что правда загрузилось: если курса нет,
// его нет и в строке. Рядом — откуда курс и когда обновился, чтобы вчерашняя
// цифра не выглядела сегодняшней.
function tickerItems(){
  const T=FIAT,loc=S.fiat&&S.fiat!=='usd'?S.fiat:'uah',L=+T[loc],U=+T.usd,E=+T.eur,ls=curSym(loc);
  const f=(v,d)=>(+v).toLocaleString(LOC[S.lang],{minimumFractionDigits:d,maximumFractionDigits:d});
  const out=[];
  if(U)out.push(['USDT','$'+f(U,4)]);
  if(U&&L)out.push(['USDT',f(L,2)+' '+ls]);
  ['USDC','DAI','FDUSD','USDe','PYUSD'].forEach(k=>{const c=STABS[k]||(k==='USDC'?USDC:null);if(c&&+c.usd)out.push([k,'$'+f(c.usd,4)])});
  if(USDC&&+USDC.usd&&+USDC[loc])out.push(['USDC',f(+USDC[loc],2)+' '+ls]);
  if(U&&L)out.push(['$',f(L/U,2)+' '+ls]);
  if(E&&L)out.push(['€',f(L/E,2)+' '+ls]);
  if(E&&U)out.push(['€','$'+f(U/E,3)]);
  return out;
}

// ---------- калькулятор средней цены покупки ----------
// Игрок записывает свои покупки на бирже, мы считаем среднюю цену входа и результат.
// Ничего не покупаем и не продаём: это счётная машинка, а не биржа.
function pfList(){return S.pf||(S.pf=[])}
// Три раздела учёта. У каждой записи свой раздел: 'sp' — спот (монеты),
// 'ex' — обмен валют, 'bg' — расходы и приходы. Старые записи без пометки — спот.
const MODES=[['sp','📈','m_sp'],['ex','💱','m_ex'],['bg','🧾','m_bg']];
function mode(){return MODES.some(m=>m[0]===S.m)?S.m:'sp'}
function setMode(m){S.m=m;save();render()}
function pfOf(m){return pfList().filter(x=>(x.m||'sp')===(m||mode()))}
function pfBy(m){const o={};pfOf(m||'sp').forEach(x=>{(o[x.sym]=o[x.sym]||[]).push(x)});return o}
// Книга учёта по монете. Идём по записям в порядке времени:
// покупка добавляет монеты и деньги в «вложено», продажа забирает монеты
// по средней цене и выносит разницу в «заработано».
// Средняя цена от продажи не меняется — это обычный способ считать, и он честный:
// продав часть, ты не стал покупать дешевле.
function pfCalc(arr){
  const list=(arr||[]).slice().sort((a,b)=>(a.at||0)-(b.at||0));
  let qty=0,cost=0,spent=0,got=0,real=0;const ops=[];
  list.forEach(x=>{
    const money=+x.usd,price=+x.price;
    if(!(money>0)||!(price>0))return;
    if(x.k==='s'){
      const q=Math.min(qty,money/price);
      const avg=qty>0?cost/qty:0;
      const r=money-avg*q;
      cost-=avg*q;qty-=q;got+=money;real+=r;
      ops.push({at:x.at||0,k:'s',money,price,qty:q,real:r,cur:x.cur||'usd',sym:x.sym});
      if(qty<1e-12){qty=0;cost=0}
    }else{
      qty+=money/price;cost+=money;spent+=money;
      ops.push({at:x.at||0,k:'b',money,price,qty:money/price,real:0,cur:x.cur||'usd',sym:x.sym});
    }
  });
  return{qty,cost,spent,got,real,ops,sum:cost,avg:qty>0?cost/qty:0};
}
// Итоги за период. Оборот — сколько денег прошло через руки, заработок — только
// то, что осталось после возврата своей же закупки. Эти два числа путают чаще
// всего: оборот большой, а заработок маленький, и это нормально.
function exSum(arr,from){
  const ops=pfCalc(arr).ops.filter(o=>o.at>=(from||0));
  let turn=0,earn=0,sold=0,n=ops.length;
  ops.forEach(o=>{turn+=o.money;if(o.k==='s'){earn+=o.real;sold+=o.money}});
  return{turn,earn,sold,n,margin:sold>0?earn/sold*100:0};
}

function monthStart(){const d=new Date();return +new Date(d.getFullYear(),d.getMonth(),1)}
function pfAvg(arr){return pfCalc(arr)}
// Валюта, в которой игрок вносит суммы. По умолчанию та же, что он выбрал для курса.
function curNow(){const c=S.cur||S.fiat||'usd';return (c==='usd'||curRate(c)>0)?c:'usd'}
function setCur(c){S.cur=c;save();render()}
function curSym(c){const f=FIATS.find(x=>x[0]===c);return f?f[1]:'$'}
function curRate(c){return c==='usd'?1:(+FIAT[c]||0)}
function fmtCur(c,v){return (+v).toLocaleString(LOC[S.lang],{maximumFractionDigits:Math.abs(v)>=100?0:2})+' '+curSym(c)}
// Сколько человек реально потратил — в тех валютах, которыми платил.
// Складывать гривны с евро нельзя, поэтому держим их отдельно, а общий итог
// считаем по курсам, которые были записаны в день каждой покупки.
function pfSpend(arr,kind){
  const by={};let usd=0;
  (arr||[]).forEach(x=>{
    const k=x.k==='s'?'s':'b';
    if(kind&&k!==kind)return;
    const c=x.cur||'usd',a=x.amt!=null&&+x.amt>0?+x.amt:+x.usd;
    by[c]=(by[c]||0)+a;usd+=+x.usd;
  });
  return{by,usd,mixed:Object.keys(by).length>1};
}
function spendLine(sp){
  const parts=Object.keys(sp.by).map(c=>fmtCur(c,sp.by[c]));

function pfExport(){
  if(!tier().exp){toast(t('ca_explock'));go('shop');return}
  // Выгружаем всё, что нужно для своей таблицы или для бухгалтера: чем платил,
  // по какому курсу, сколько монет вышло. Без этого в Excel пришлось бы считать заново.
  const head=['Дата','Тип','Монета','Сумма','Валюта','Сумма $','Цена монеты $','Количество','Курс валюты','Раздел','Подпись'];
  const num=(v,d)=>String((+v).toFixed(d)).replace('.',',');
  const rows=[head.join(';')].concat(
    pfOf(mode()).slice().sort((a,b)=>(a.at||0)-(b.at||0)).map(x=>{
      const cur=(x.cur||'usd').toUpperCase(),amt=x.amt!=null&&+x.amt>0?+x.amt:+x.usd,rate=+x.rate>0?+x.rate:1;
      const qty=+x.usd/+x.price;
      const m=x.m||'sp';
      return [new Date(x.at).toISOString().slice(0,10),
        m==='bg'?(x.k==='s'?'приход':'расход'):(x.k==='s'?'продажа':'покупка'),
        x.sym, num(amt,2), cur, num(x.usd,2), num(x.price,8), num(qty,8), num(rate,4),
        m==='ex'?'обмен':m==='bg'?'деньги':'спот', (x.note||'').replace(/;/g,' ')].join(';');
    }));
  // Итоговая строка: сразу видно, сколько вложено и сколько вернулось
  const sp=pfSpend(pfOf(mode()),'b'),ss=pfSpend(pfOf(mode()),'s');
  rows.push(['','ИТОГО','','','',num(sp.usd-ss.usd,2),'','','','',''].join(';'));
  const txt=rows.join('\n');
  try{navigator.clipboard.writeText(txt).then(()=>toast(t('ca_expok')),()=>toast(txt.slice(0,60)))}catch(e){toast(t('ca_expok'))}
}
// Экран SHR перерисовывается сам по себе — когда приходят цены, курс или ответ
// сервера. Если в этот момент человек набирал сумму, она пропадала, и кнопка
// говорила «впиши сумму», хотя он её только что вписал. Поэтому: пока он печатает,
// экран не трогаем, а при перерисовке возвращаем на место и значения, и курсор.
const CALCIN=['pfu','pfp','pfc','pfs','pfn'];
let CALCV={};
function renderCalc(){
  const box=$('calc');if(!box)return;
  const a=document.activeElement,fid=a&&CALCIN.indexOf(a.id)>=0?a.id:null;
  CALCIN.forEach(id=>{const e=$(id);if(e)CALCV[id]=e.value});
  if(fid&&(fid==='pfu'||fid==='pfp'||fid==='pfn'))return; // человек печатает — не мешаем
  box.innerHTML=calcHtml();
  CALCIN.forEach(id=>{const e=$(id);if(e&&CALCV[id]!=null&&CALCV[id]!=='')e.value=CALCV[id]});
  // Фокус возвращаем только в текстовые поля. Выпадающий список валюты или
  // монеты на айфоне от фокуса снова открывает колесо выбора — и после смены
  // валюты оно выскакивало бесконечно, а экран казался зависшим.
  if(fid&&(fid==='pfu'||fid==='pfp'||fid==='pfn')){const e=$(fid);if(e){e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(x){}}}
}

  if(m==='ex')return tabs+exHtml();
  if(m==='bg')return tabs+bgHtml();

}

function clanPts(){return S.clan.members.reduce((a,m)=>a+m.pts,0)}
function clap(i){const m=S.clan.members[i];if(m){m.th=(m.th||0)+1;toast('👏 '+t('thanks',m.n));save();render()}}
function sendMsg(){const v=($('cmsg').value||'').trim().slice(0,140);if(!v)return;
  if(/https?:|t\.me|@\w{4,}/i.test(v)){toast(t('nolinks'));return}
  $('cmsg').value='';const m={me:true,t:v,ts:Date.now()};if(S.gm){m.g=1;S.gm=false;if(S.gmFree>0)S.gmFree--;else toast('✨ '+t('gm')+' · '+GM+' ⭐ ('+t('nostars')+')')}if(S.ch==='clan'||S.ch.startsWith('room:'))S.wk.m++;if(S.ch==='clan'){if(!S.clan)return;if(live()&&S.clan.id){srvChat('clan:'+S.clan.id,v,m.g);save();return}say(m)}

    const c=document.createElement('canvas');c.width=cw;c.height=ch;const g=c.getContext('2d');

    const types=['video/mp4;codecs=avc1.42E01F,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4;codecs=avc1,opus',
      'video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    const mime=types.find(x=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(x))||'';
    let mr;try{mr=new MediaRecorder(vs,Object.assign({videoBitsPerSecond:1600000,audioBitsPerSecond:96000},mime?{mimeType:mime}:{}))}
    catch(e){rej('shrink');return}

    mr.onstop=()=>{
      try{v.pause()}catch(e){}
      try{actx&&actx.close()}catch(e){}
      vs.getTracks().forEach(tr=>{try{tr.stop()}catch(e){}});
      const type=(mr.mimeType||mime||'video/mp4').split(';')[0];
      const b=new Blob(parts,{type});
      if(b.size<2000){rej('shrink');return}
      res(b);
    };
    const draw=()=>{
      if(done)return;
      try{g.drawImage(v,0,0,cw,ch)}catch(e){}
      if(onp)onp(Math.min(1,v.currentTime/end));

// Фото уменьшаем на телефоне до 1440 точек по длинной стороне: так оно летит
// быстро и не теряет вида. Телефонные 12 мегапикселей ленте не нужны.
function photoPick(inp,kind){
  const f=inp.files&&inp.files[0];inp.value='';
  if(!f)return;
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{
    const k=Math.min(1,1440/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    c.toBlob(b=>{
      URL.revokeObjectURL(url);
      if(!b){toast(t('ps_bad'));return}
      vidPrepDrop();
      VKIND=kind==='story'?'story':'photo';if(VKIND==='story')VSMEDIA='photo';VFILE=b;VNEED=false;VCUT=0;VUP=-1;VSTAGE='';
      PHPREV=c.toDataURL('image/jpeg',0.5);
      vidUpOpen();
    },'image/jpeg',0.86);
  };
  im.onerror=()=>{URL.revokeObjectURL(url);toast(t('ps_bad'))};
  im.src=url;
}

// ---------- звонки ----------
// Голос и видео идут напрямую между телефонами (WebRTC) и всегда шифруются.
// Сервер только сводит телефоны: передаёт «кто кому звонит» и адреса для
// соединения. В конференции до 5 человек каждый связан с каждым.
let CALL=null,RING=null,CALLT=0,RINGT=0,RINGNO={},CALLCLK=0;
const CALLMAX=5;
function callOk(){return !!(window.RTCPeerConnection&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)}
function cpost(act,data){return SRV?SRV.post('/call',Object.assign({act:act},data||{})):Promise.reject('off')}
async function callMedia(video,face){
  const a={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
  const v=video?{facingMode:face||'user',width:{ideal:640},height:{ideal:480},frameRate:{ideal:24,max:30}}:false;
  try{return await navigator.mediaDevices.getUserMedia({audio:a,video:v})}
  catch(e){
    if(video){try{const s=await navigator.mediaDevices.getUserMedia({audio:a});toast(t('cl_nocam'));return s}catch(e2){}}
    throw e;
  }
}
function callErr(e){toast(e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?t('cl_perm'):t('cl_nomic'))}
function callNew(id,video,host,st){
  return {id:id,video:!!video,host:host,local:st,peers:{},members:[],after:0,state:'out',t0:0,
    mic:true,cam:!!video&&st.getVideoTracks().length>0,face:'user',min:false,ice:[]};
}
async function callStart(to,video){
  if(!live()){toast(t('lead_demo'));return}
  if(!callOk()){toast(t('cl_unsup'));return}
  if(CALL){callShow();return}
  to=(Array.isArray(to)?to:[to]).map(Number).filter(x=>x&&x!==SRVID).slice(0,CALLMAX-1);
  if(!to.length)return;
  closeModal();
  let st;try{st=await callMedia(video)}catch(e){callErr(e);return}
  CALL=callNew('',video,SRVID,st);
  CALL.members=to.map(id=>{const p=callWho(id);return {id:id,nick:p.nick,av:p.av,avu:p.avu,state:'ring'}});
  callUi();tone('out');
  let j;try{j=await cpost('start',{to:to,video:video?1:0,cam:CALL.cam?1:0})}catch(e){j={error:'net'}}
  if(!CALL)return;
  if(!j||j.error){const er=j&&j.error;callEnd(0);toast(er==='nocall'?t('cl_nocall'):er==='slow'?t('cl_slow'):er==='banned'?t('vd_ban'):t('cl_fail'));return}
  if(j.skipped)toast(t('cl_skip',j.skipped));
  CALL.id=j.id;CALL.ice=j.ice||[];CALL.members=j.members||CALL.members;

async function callPoll(){

// Сверяем, кто в звонке, с тем, с кем у нас есть связь. В каждой паре
// соединение начинает тот, у кого номер меньше, — так двое не звонят друг
// другу одновременно.
function callSync(){
  const c=CALL;if(!c)return;
  const others=c.members.filter(m=>m.id!==SRVID);
  if(c.state==='out'&&others.some(m=>m.state==='in')){c.state='in';c.t0=Date.now();toneStop()}
  for(const m of others){
    const p=c.peers[m.id];
    if(m.state==='in'){
      if(!p){if(SRVID<m.id)callOffer(m.id)}
      else if(p.offerer&&p.st!=='connected'&&Date.now()-p.at>16000){callDrop(m.id);callOffer(m.id)}
    }else if(p)callDrop(m.id);
  }

function callPc(uid,withTracks){
  const c=CALL;
  const pc=new RTCPeerConnection({iceServers:c.ice||[]});
  const p={pc:pc,uid:uid,st:'new',at:Date.now(),stream:null,offerer:false,vid:false};
  c.peers[uid]=p;
  if(withTracks){
    c.local.getTracks().forEach(tr=>pc.addTrack(tr,c.local));
    // Сами без камеры, но собеседник может её включить — готовы принять видео
    if(c.video&&!c.local.getVideoTracks().length){try{pc.addTransceiver('video',{direction:'recvonly'})}catch(e){}}
  }
  pc.ontrack=e=>{
    if(!p.stream)p.stream=new MediaStream();
    if(!p.stream.getTracks().includes(e.track))p.stream.addTrack(e.track);
    const tr=e.track;
    if(tr.kind==='video'){p.vid=!tr.muted;tr.onmute=()=>{p.vid=false;callTile(uid)};tr.onunmute=()=>{p.vid=true;callTile(uid)};tr.onended=()=>{p.vid=false;callTile(uid)}}
    callTile(uid,1);
  };

    p.st=pc.connectionState;
    if(p.st==='connected'){callRate()}
    if(p.st==='failed'&&p.offerer&&CALL===c){callDrop(uid);callOffer(uid)}
    callUi();
  };
  return p;
}
// Адреса для соединения собираем сразу целиком (до 3 секунд), чтобы отправить
// одну записку вместо десятка мелких.
function iceDone(pc){
  return new Promise(res=>{
    if(pc.iceGatheringState==='complete'){res();return}
    const tm=setTimeout(res,3000);
    pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(tm);res()}});
  });
}
async function callOffer(uid){

    await p.pc.setLocalDescription(await p.pc.createOffer());
    await iceDone(p.pc);

    await sigSend(c,uid,'offer',p.pc.localDescription.sdp);
  }catch(e){}
}
async function callSig(s){
  const c=CALL;if(!c)return;
  if(s.kind==='offer'){
    if(c.peers[s.src])callDrop(s.src);
    const p=callPc(s.src,false);
    try{
      await p.pc.setRemoteDescription({type:'offer',sdp:s.data});
      c.local.getTracks().forEach(tr=>p.pc.addTrack(tr,c.local));camApply(p.pc);
      await p.pc.setLocalDescription(await p.pc.createAnswer());
      await iceDone(p.pc);
      if(CALL!==c||c.peers[s.src]!==p)return;
      await sigSend(c,s.src,'answer',p.pc.localDescription.sdp);
    }catch(e){}
  }else if(s.kind==='answer'){
    const p=c.peers[s.src];
    if(p&&p.offerer&&p.pc.signalingState==='have-local-offer'){try{await p.pc.setRemoteDescription({type:'answer',sdp:s.data})}catch(e){}}
  }
}
// В конференции каждый шлёт своё видео каждому, поэтому чем больше людей,
// тем скромнее поток: иначе телефон и мобильный интернет не вытянут.
function callRate(){
  const c=CALL;if(!c)return;
  const n=Object.keys(c.peers).length,max=n<=1?900000:n===2?450000:280000;
  Object.values(c.peers).forEach(p=>p.pc.getSenders().forEach(sd=>{
    if(!sd.track||sd.track.kind!=='video')return;
    try{const pr=sd.getParameters();if(!pr.encodings||!pr.encodings.length)pr.encodings=[{}];pr.encodings[0].maxBitrate=max;sd.setParameters(pr).catch(()=>{})}catch(e){}
  }));
}
// Камера выключена — новому собеседнику тоже не шлём кадров
function camApply(pc){const c=CALL;if(!c||c.cam)return;const tr=c.local.getVideoTracks()[0];if(!tr)return;
  pc.getSenders().forEach(sd=>{if(sd.track===tr){sd._v=1;sd.replaceTrack(null).catch(()=>{})}})}
// Постоянное соединение с комнатой звонка (если сервер его поддерживает).
// Обрыв — не беда: переподключаемся, а пока его нет, записки идут через базу.
function callWs(){
  const c=CALL;if(!c||!c.id||c.ws)return;
  let api='';try{api=API}catch(e){}
  if(!api||!window.WebSocket)return;
  let init='';try{init=TG.initData}catch(e){}
  const ws=new WebSocket(api.replace(/^http/,'ws')+'/callws?id='+encodeURIComponent(c.id)+'&init='+encodeURIComponent(init));
  c.ws=ws;
  ws.onopen=()=>{c.wsOk=true;c.wsPing=setInterval(()=>{try{ws.send('{"t":"ping"}')}catch(e){}},25000)};
  ws.onmessage=e=>{
    if(CALL!==c)return;
    let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(m.t==='sig')callSig({src:m.src,kind:m.kind,data:m.data});
    if(m.t==='peers'){
      // Кто-то отключился от комнаты — не ждём базу, сразу убираем его плитку
      Object.keys(c.peers).map(Number).forEach(id=>{if(m.ids.indexOf(id)<0&&c.peers[id].st!=='new')callDrop(id)});
      c.members.forEach(x=>{if(m.ids.indexOf(x.id)>=0&&x.state!=='in')x.state='in'});
      callSync();
    }
  };
  ws.onclose=()=>{clearInterval(c.wsPing);c.wsOk=false;c.ws=null;if(CALL===c)setTimeout(()=>{if(CALL===c)callWs()},2000)};
  ws.onerror=()=>{};

function tone(kind){
  toneStop();
  let ac;try{const A=window.AudioContext||window.webkitAudioContext;ac=TONEAC||(TONEAC=new A());if(ac.state==='suspended')ac.resume()}catch(e){return}
  const beep=(fs,dur,at)=>{try{const g=ac.createGain();g.gain.setValueAtTime(0,ac.currentTime+at);g.gain.linearRampToValueAtTime(0.07,ac.currentTime+at+0.02);
    g.gain.setValueAtTime(0.07,ac.currentTime+at+dur-0.04);g.gain.linearRampToValueAtTime(0,ac.currentTime+at+dur);g.connect(ac.destination);
    fs.forEach(f=>{const o=ac.createOscillator();o.frequency.value=f;o.connect(g);o.start(ac.currentTime+at);o.stop(ac.currentTime+at+dur+0.02)})}catch(e){}};
  const hap=()=>{try{const w=window.Telegram&&Telegram.WebApp;if(w&&w.HapticFeedback)w.HapticFeedback.impactOccurred('heavy')}catch(e){}};
  if(kind==='end'){beep([425],0.18,0);beep([425],0.18,0.3);beep([425],0.18,0.6);return}
  const once=kind==='in'?()=>{beep([660,880],0.35,0);beep([660,880],0.35,0.5);hap()}:()=>beep([425],1,0);
  once();TONEIV=setInterval(once,kind==='in'?2600:4000);
}
function toneStop(){clearInterval(TONEIV);TONEIV=0}

// ---------- истории на сутки ----------
// Как в Instagram: фото, видео до минуты или своя реклама — висит 24 часа и
// исчезает. Кружки сверху на главной, у себя — плюсик на аватаре.
let STORIES=null,SV=null,SVT=0,VSMEDIA='video',VAD=false,VTAGS=[],VLINKS=[],TAGV={};
function storiesPull(){if(live())srv('/stories',{},j=>{STORIES=j.list||[];renderStories()})}
function myStory(){return (STORIES||[]).find(g=>g.id===SRVID)}
function storyRing(g){return g?(g.fresh?' ring':' ring seen'):''}
function storyBar(){
  if(!live())return '';
  const mine=myStory();
  const me=`<button class="stc" onclick="${mine?`storyOpen(${SRVID})`:'storyAdd()'}">
      <span class="stav${storyRing(mine)}">${S.avImg?meAv(62):`<span class="face em" style="width:62px;height:62px;font-size:31px">${esc(S.av||'🎩')}</span>`}
      <i class="stplus" onclick="event.stopPropagation();storyAdd()">+</i></span><b>${t('st_me')}</b></button>`;
  const others=(STORIES||[]).filter(g=>g.id!==SRVID).map(g=>`<button class="stc" onclick="storyOpen(${g.id})">
      <span class="stav${storyRing(g)}">${face(g,62)}</span><b>${esc(alias(g.id,g.nick)||t('vd_anon'))}</b></button>`).join('');
  return `<div class="stbar">${me}${others}</div>`;
}
function renderStories(){const e=$('stories');if(e)e.innerHTML=storyBar();if(S.ch==='me'||S.ch==='prof')render()}
function storyAdd(){
  if(!live()){toast(t('vd_demo'));return}
  VAD=false;VTAGS=[];VLINKS=[];
  modal(`<h2 style="margin-top:0">${t('st_new')}</h2>
    <div class="addsheet" style="grid-template-columns:1fr 1fr">
      <label class="att">${ICOB.pic}<span>${t('ps_k_photo')}</span><input type="file" accept="image/*" hidden onchange="closeModal();VSMEDIA='photo';photoPick(this,'story')"></label>
      <label class="att">${ICOB.film}<span>${t('st_k_video')}</span><input type="file" accept="video/*" hidden onchange="closeModal();VKIND='story';VSMEDIA='video';vidPick(this)"></label>
    </div>
    <div class="muted" style="text-align:left;font-size:12.5px;margin-top:8px">${t('st_new_d')}</div>
    <button class="btn ghost" onclick="closeModal()">${t('back')}</button>`);
}
function storyOpen(uid){
  const go1=()=>{
    const gi=(STORIES||[]).findIndex(g=>g.id===uid);
    if(gi<0){if(uid===SRVID)storyAdd();else toast(t('st_gone'));return}
    const g=STORIES[gi];let ii=g.items.findIndex(x=>!x.seen);if(ii<0)ii=0;
    SV={gi,ii};svDraw();
  };
  if(STORIES)go1();else srv('/stories',{},j=>{STORIES=j.list||[];go1()});
}
function svClose(){clearTimeout(SVT);SV=null;const e=$('sview');if(e){e.innerHTML='';e.hidden=true}renderStories()}
function svStep(d){
  if(!SV||!STORIES)return;
  const g=STORIES[SV.gi];
  let ii=SV.ii+d,gi=SV.gi;
  if(ii>=g.items.length){gi++;ii=0;if(gi>=STORIES.length){svClose();return}}
  else if(ii<0){gi--;if(gi<0){gi=0;ii=0}else ii=STORIES[gi].items.length-1}
  SV={gi,ii};svDraw();
}
function svDraw(){
  const e=$('sview');if(!e||!SV)return;
  clearTimeout(SVT);
  const g=STORIES[SV.gi],v=g.items[SV.ii];if(!v){svClose();return}
  if(!v.seen){v.seen=true;g.fresh=g.items.some(x=>!x.seen);srv('/vid',{id:v.id,act:'sview'})}
  const mine=g.id===SRVID,tagged=(v.tags||[]).some(x=>x.id===SRVID);
  const ago=Math.max(1,Math.round((Date.now()-v.at)/3600000));
  e.hidden=false;
  e.innerHTML=`<div class="svbars">${g.items.map((x,i)=>`<i class="${i<SV.ii?'done':i===SV.ii?'cur':''}"><b id="${i===SV.ii?'svcur':''}"></b></i>`).join('')}</div>

const REACTS=['❤️','👍','😂','😮','😢','🔥','🙏','👏','💯','🚀'];
let LPT=0;
function lpStart(e,fn){lpEnd();LPT=setTimeout(()=>{LPT=0;try{const w=window.Telegram&&Telegram.WebApp;w&&w.HapticFeedback&&w.HapticFeedback.impactOccurred('medium')}catch(x){}fn()},450)}

function reHtml(re,me,fn){
  if(!re||!re.length)return '';
  return `<div class="rerow${me?' me':''}">${re.map(r=>`<button class="rec${r.me?' on':''}" onclick="${fn.replace('§',r.e)}">${r.e}${r.n>1?`<b>${r.n}</b>`:''}</button>`).join('')}</div>`;
}
function reApply(m,emo){
  m.re=(m.re||[]).map(x=>Object.assign({},x));
  const mine=m.re.find(x=>x.me);
  if(mine){mine.n--;mine.me=false}
  if(!mine||mine.e!==emo){let x=m.re.find(y=>y.e===emo);if(!x){x={e:emo,n:0,me:false};m.re.push(x)}x.n++;x.me=true}
  m.re=m.re.filter(x=>x.n>0);
}
function copyText(s){
  const done=()=>toast(t('cp_ok'));
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(s).then(done,()=>copyOld(s));return}}catch(e){}
  copyOld(s);
  function copyOld(x){const a=document.createElement('textarea');a.value=x;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';
    document.body.appendChild(a);a.select();a.setSelectionRange(0,x.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();
    if(ok)done();else selShow(x)}
}

let RENDERING=false;
(function(){
  if(typeof Element==='undefined')return;
  const d=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
  if(!d||!d.set)return;
  Object.defineProperty(Element.prototype,'innerHTML',{configurable:true,enumerable:d.enumerable,
    get(){return d.get.call(this)},
    set(v){
      if(RENDERING&&typeof v==='string'&&this.__h===v&&this.isConnected)return;
      this.__h=typeof v==='string'?v:undefined;
      d.set.call(this,v);
    }});
})();
function render(){

let OBI=0,OBIV=0,OBHOLD=0,OBSET=0;
function obGo(i){
  const n=OB.length;OBI=((i%n)+n)%n;OBHOLD=Date.now();
  const t2=$('obtrack');if(t2)t2.scrollTo({left:OBI*t2.clientWidth,behavior:'smooth'});
  obDots();
}
function obDots(){
  const d=$('obdots');if(!d)return;
  [].forEach.call(d.children,(e,i)=>e.className=i===OBI?'on':'');
}
function obTick(){
  const tr=$('obtrack');if(!tr||S.ch!=='game'||document.hidden)return;
  if(Date.now()-OBHOLD<12000)return;            // человек листал сам — не мешаем
  if(matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const n=OB.length;OBI=(OBI+1)%n;
  tr.scrollTo({left:OBI*tr.clientWidth,behavior:'smooth'});obDots();
}
function obBind(){
  const tr=$('obtrack');if(!tr||tr.dataset.b)return;
  tr.dataset.b='1';
  // Открываем на первом несделанном шаге: с выполненными человеку делать нечего.
  // Ширина дорожки в этот момент ещё может быть нулевой, поэтому прокручиваем
  // в следующем кадре, когда браузер её уже посчитал.
  if(!OBSET){
    OBSET=1;
    const i=OB.findIndex((_,k)=>!S.ob.f[k]);
    if(i>0){OBI=i;requestAnimationFrame(()=>{const w=tr.clientWidth;if(w)tr.scrollLeft=OBI*w;obDots()})}
  }
  tr.addEventListener('scroll',()=>{
    const i=Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth));
    if(i!==OBI){OBI=i;obDots()}
  },{passive:true});
  ['touchstart','pointerdown','wheel'].forEach(e=>tr.addEventListener(e,()=>{OBHOLD=Date.now()},{passive:true}));
  if(!OBIV)OBIV=setInterval(obTick,5000);
  if(OBI)tr.scrollLeft=OBI*tr.clientWidth;
}

  FQ=v;clearTimeout(FTI);

  },350);

  return `<div class="cm${m.g?' gold':''}"${m.id?` id="cm-${m.id}"`:''}${lpA}><div class="ava${me?frm():''}">${me?pubAv(34):(m.avu?face({avu:m.avu,av:m.f},34):m.f)}</div><div class="body"><div class="nm"${me?' style="color:var(--gold)"':''}>${esc(me?pubName():alias(m.uid,m.n))}<time>${hm(m.ts)}</time></div><div class="tx">${m.gift!=null?`🎁 ${t('gift_msg',esc(m.to),GIFTS[m.gift].e+' '+t('g'+m.gift))}`:esc(msgText(m))}</div>${m.id?reHtml(m.re,false,`msgReact(${m.id},'§')`):''}</div>${me?'':`<button class="rp" onclick="giftPick('${esc(m.n)}')" aria-label="${t('gift')}">🎁</button><button class="rp" onclick="report()" aria-label="Report">🚩</button>`}${boss?`<button class="rp" onclick="clanMsgMenu(${m.id},${m.uid|0},'${esc((m.n||'').replace(/'/g,''))}')" aria-label="${t('cn_admin')}">⋯</button>`:''}</div>`}
function chatHtml(arr,icon,title,desc){
  const room=S.ch;
  // Кнопка «показать раньше» появляется, пока в комнате есть что показать
  const more=live()&&room.startsWith('room:')&&arr.length>=20&&CHMORE[room]!==false
    ?`<button class="btn ghost" style="margin:0 0 8px" onclick="chatOlder('${esc(room)}')">${CHbusy?t('loading'):t('ch_older')}</button>`:'';
  return `<div class="welcome"><div class="big">${icon}</div><h2>${esc(title)}</h2><div class="muted">${esc(desc)}</div></div>${more}${arr.length?arr.map(msgHtml).join(''):`<div class="muted" style="padding:8px 0">${t('quiet')}</div>`}`}
function hubChans(){const free=[...new Set([...COINS.slice(0,3).map(c=>c.s),...S.extra])],paid=COINS.slice(3,6).map(c=>c.s).filter(x=>!free.includes(x));
  // Стол и война играются против соперников, а соперники пока боты. В живом
  // клубе шесть «игроков», которых на самом деле нет, — это обман, поэтому прячем.
  const bots=!live();
  return [['cat_game',[['game','🎯',t('ch_game')],['calc','🧮',t('ch_calc')],['an','#',t('ch_an')],
      ...(bots?[['table','♠',t('ch_table')]]:[]),['usb','💾',t('ch_usb')],['robot','🤖',t('ch_robot')]]],
    ['cat_talk',[['room:general','#',t('ch_general')],...free.map(x=>['room:'+x,'#',t('ch_room',x.toLowerCase())]),...paid.map(x=>['room:'+x,'#',t('ch_room',x.toLowerCase()),!allowed(x)])]],
    ['cat_media',[['news','📰',t('ch_news')],['video','▶',t('ch_video')]]],
    ['cat_club',[['shop','⭐',t('ch_shop')],['me','👤',t('ch_me')],['ord','🧰',t('o_h')],['idea','💡',t('ch_idea')],['rules','§',t('ch_rules')],['legal','§',t('ch_legal')]]]]}
function clanChans(){const bots=!live();
  return S.clan?[['clans',[['clan','#',t('ch_clan')],...(bots?[['cwar','⚔️',t('ch_war')]]:[]),['crank','🏆',t('ch_crank')]]]]:[['clans',[['clan','+',t('ch_join')]]]]}
function chanInfo(id){if(id==='chats')return ['chats','💬',t('nav_home')];if(id==='set')return ['set','⚙️',t('set_h')];if(id==='play')return ['play','🎯',t('play_h')];if(id==='video')return ['video','🎬',t('nav_video')];if(id==='pm')return ['pm','✉️',t('pm_h')];if(id==='idea')return ['idea','💡',t('id_h')];if(id==='pres')return ['pres','🎁',t('pr_gift')];if(id==='ord')return ['ord','🧰',t('o_h')];if(id==='adm')return ['adm','⚙️',t('ad_h')];if(id==='dm')return ['dm','✉️',t('pms_h')];for(const g of hubChans().concat(clanChans()))for(const c of g[1])if(c[0]===id)return c;return ['game','🎯',t('ch_game')]}
function topic(id){return id==='news'?t('nw_h'):id==='game'?t('game_d'):id==='room:general'?t('gen_d'):id.startsWith('room:')?t('room_d',id.slice(5)):id==='clan'&&S.clan?t('chat_rule'):''}
function renderTyping(){const e=$('typing');if(e)e.textContent=TYP?t('typing',TYP):''}
let LG=0;
function logoSvg(h){const id='lg'+(++LG);return `<svg viewBox="-3 -3 216 46" height="${h}" role="img" aria-label="SHRhub" style="display:block;overflow:visible"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="40" gradientUnits="userSpaceOnUse"><stop offset="0" style="stop-color:var(--goldHi)"/><stop offset="1" style="stop-color:var(--gold)"/></linearGradient></defs><g fill="none" stroke="url(#${id})" stroke-width="7" stroke-linejoin="miter"><path d="M31 3.5H9L3.5 9v5.5L9 20h16l5.5 5.5V31L25 36.5H1"/><path d="M43.5 0v40M66.5 0v40M43.5 20h23"/><path d="M81.5 40V3.5H101l5.5 5.5v5.5L101 20H81.5M94 20l13 20"/></g><g fill="none" style="stroke:var(--text)" stroke-width="3.6" stroke-linejoin="miter"><path d="M124 0v40M124 16h15l4 4v20"/><path d="M153 14v22l4 4h12l4-4V14"/><path d="M183 0v40h16l4-4V18l-4-4h-16"/></g></svg>`}
function mono(){return `<svg viewBox="-3 -3 40 46" height="22" aria-hidden="true" style="display:block"><path d="M31 3.5H9L3.5 9v5.5L9 20h16l5.5 5.5V31L25 36.5H1" fill="none" stroke="currentColor" stroke-width="7"/></svg>`}
function renderShell(){const k=S.clan;
  $('rail').innerHTML=`<button class="srv logo ${S.srv==='hub'?'on':''}" onclick="go('game')" title="SHRhub" aria-label="SHRhub"><img src="${IMG.emb}" alt=""></button>
    <button class="srv" onclick="openAs()" title="${t('sp_h')}" aria-label="${t('sp_h')}">💬</button><div class="rsep"></div>
    ${k?`<button class="srv ${S.srv==='clan'?'on':''}" onclick="go('clan')" title="${esc(k.name)}" aria-label="${esc(k.name)}">${embOf(k,22)}</button>`:`<button class="srv add ${S.srv==='clan'?'on':''}" onclick="go('clan')" title="${t('clan_go')}" aria-label="${t('clan_go')}">+</button>`}`;
  $('srvh').innerHTML=S.srv==='clan'&&k?`${embOf(k,20)} ${esc(k.name)}<small>${t('clans')}</small>`:`${logoSvg(22)}<small style="margin-top:5px">${t('sub')}</small>`;
  const list=S.srv==='clan'?clanChans():hubChans();
  $('clist').innerHTML=list.map(([c,items])=>`<div class="cat">${t(c)}</div>`+items.map(([id,ic,nm,lk])=>`<button class="chan ${S.ch===id?'on':''}" onclick="${lk?`offerOne('${id.slice(5)}')`:`go('${id}')`}"><span class="h">${ic}</span>${esc(nm)}${lk?'<span class="lk">🔒</span>':UN[id]?`<span class="badge">${UN[id]}</span>`:''}</button>`).join('')).join('');
  $('upanel').innerHTML=`<div class="ava${frm()}">${pubAv(34)}<i class="dot"></i></div><div class="who">${esc(pubName())}<small>${t('rk'+rankIdx())} · 🎯 ${S.pts} · ${TIERS[S.tier].n}</small></div><button class="ib" style="font-size:17px" onclick="go('set')" aria-label="${t('set_h')}">⚙</button>`;
  const ci=chanInfo(S.ch);
  // Слева всегда SHRhub: человек должен видеть, в каком приложении он находится.
  // Где именно он сейчас — рядом, помельче.
  // Свой аватар человек узнаёт мгновенно, а логотип приложения он и так видит
  // в заголовке Telegram. Если аватара нет — показываем эмодзи-заглушку.
  $('chi').className='havb'+(['me','stats','gift'].indexOf(S.ch)>=0?' on':'');
  $('chi').innerHTML=S.avImg
    ?`<img src="${S.avImg}" alt="">`
    :`<span>${esc(S.priv&&S.priv.anon?'👤':(S.av||'👤'))}</span>`;
  $('chn').textContent='SHRhub';$('chw').textContent=ci[2];$('cht').textContent=topic(S.ch);
  $('mem').innerHTML=membersHtml();$('gmb').className='gmb'+(S.gm?' on':'');$('thb').innerHTML=S.theme==='light'
    ? '<svg class="hic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.1 14.9A8.6 8.6 0 0 1 9.1 3.9a.9.9 0 0 0-1.2-1A9.9 9.9 0 1 0 21.1 16a.9.9 0 0 0-1-1.1Z"/></svg>'
    : '<svg class="hic" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 6.6a5.4 5.4 0 1 0 0 10.8 5.4 5.4 0 0 0 0-10.8Zm0 2.4a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"/><path d="M10.9 1.6h2.2v3.1h-2.2zM10.9 19.3h2.2v3.1h-2.2zM1.6 10.9h3.1v2.2H1.6zM19.3 10.9h3.1v2.2h-3.1zM4.2 5.8 5.8 4.2l2.2 2.2L6.4 8ZM16 17.6l1.6-1.6 2.2 2.2-1.6 1.6ZM17.6 8 16 6.4l2.2-2.2L19.8 5.8ZM6.4 16 8 17.6l-2.2 2.2-1.6-1.6Z"/></svg>';
  $('thb').title=t('theme');
  // Стрелка назад есть на любом экране, кроме пяти корневых вкладок: там
  // возвращаться некуда, а везде остальное человек откуда-то пришёл.
  $('backb').className='ib menu'+(isRoot(S.ch)?'':' show');
  tgBack(!isRoot(S.ch));
  const sub=!S.lite&&inChats();
  if(S.lite){
    // Лайт: четыре понятные кнопки с подписями. «Главный экран» — калькулятор,
    // до него один нажим с любого места.
    $('tabs').className='tabs lite';
    $('tabs').innerHTML=LTABS.map(([id,ic,k])=>{
      const on=S.ch===id||(id==='dm'&&S.ch==='pm')?'on':'';
      const n=id==='dm'?PMN:0;
      const act=id==='__help'?'openAs()':`go('${id}')`;
      return `<button class="${on}" onclick="${act}"><span><span class="tbico">${tabIcon(ic)}</span>${n?`<i>${n}</i>`:''}</span>${t(k)}</button>`}).join('');
  }else{
  $('tabs').className='tabs'+(sub?' sub':'');
  $('tabs').innerHTML=(sub?CTABS:TABS.filter(x=>OWNER||secOn(x[0]))).map(([id,ic,k])=>{
    const n=sub
      ? (id==='chats'?Object.keys(UN).filter(x=>x.startsWith('room:')).reduce((a,x)=>a+(UN[x]||0),0)
        :id==='dm'?PMN:id==='online'?0:0)
      : (id==='chats'?Object.keys(UN).filter(x=>x.startsWith('room:')).reduce((a,x)=>a+(UN[x]||0),0)
        :id==='clan'?(warOn()?'⚔':(UN.clan||0)):0);
    const icon=tabIcon(ic);
    const act=id==='__out'?"go('game')":`go('${id}')`;
    const on=!sub&&tabOf(S.ch)===id ? 'on'
      : sub&&(S.ch===id||(id==='chats'&&S.ch.startsWith('room:'))||(id==='dm'&&S.ch==='pm')) ? 'on' : '';
    return `<button class="${on}${id==='__out'?' out':''}" onclick="${act}"><span><span class="tbico">${icon}</span>${n?`<i>${n}</i>`:''}</span>${t(k)}</button>`}).join('');
  }
  $('composer').className='composer'+(isChat()?' on':'');$('cmsg').placeholder=t('write')+' #'+ci[2]}
function membersHtml(){
  // Показываем тех, кто правда заходил. Выдуманных участников нет нигде:
  // без Telegram список просто пустой.
  if(live()&&S.srv!=='clan'){
    const L=(LIVEIN&&LIVEIN.list)||[];
    if(!L.length)return `<div class="mcat">${t('online',1)}</div><div class="mrow"><div class="ava${frm()}">${pubAv(34)}<i class="dot"></i></div><div>${esc(pubName())}<small>${t('rk'+rankIdx())}</small></div></div><div class="mcat">${t('onl_none')}</div>`;
    return `<div class="mcat">${t('online',L.length)}</div>`+L.map(p=>`<div class="mrow" onclick="openProf(${p.id})" style="cursor:pointer"><div class="ava">${p.avu?face(p,34):esc(p.av||'👤')}<i class="dot"></i></div><div>${esc(alias(p.id,p.nick))}<small class="onl"><i></i>${t('onl_on')}</small></div></div>`).join('');
  }
  const ppl=S.srv==='clan'&&S.clan?S.clan.members.filter(m=>!m.me).map(m=>({n:m.n,f:m.f})):[];
  const on=ppl.filter(p=>ONL[p.n]!==false),off=ppl.filter(p=>ONL[p.n]===false);
  const row=(p,o)=>`<div class="mrow ${o?'':'off'}"><div class="ava">${p.f}<i class="dot ${o?'':'off'}"></i></div><div>${esc(p.n)}${o?`<small>${t('st_play',COINS[p.n.length%3].s)}</small>`:''}</div></div>`;
  return `<div class="mcat">${t('online',on.length+1)}</div><div class="mrow"><div class="ava${frm()}">${pubAv(34)}<i class="dot"></i></div><div>${esc(pubName())}<small>${t('rk'+rankIdx())}</small></div></div>${on.map(p=>row(p,1)).join('')}${off.length?`<div class="mcat">${t('offline',off.length)}</div>${off.map(p=>row(p,0)).join('')}`:''}`}
function membersModal(){if(live())pullOnline();modal(`<h2 style="margin-top:0">${t('members_h')}</h2><div class="list">${membersHtml()}</div><button class="btn ghost" onclick="closeModal()">${t('back')}</button>`)}
$('cmsg').onkeydown=e=>{if(e.key==='Enter')sendMsg()};
function rules(){modal(`<div style="text-align:right">${langSel('lang1','rules()')}</div>
  <img class="splash" src="${IMG.badge}" alt="SHARP CRYPTO"><div class="muted">${t('sub')}</div>
  <div style="font-family:var(--display);font-size:56px;margin:10px 0 4px">18+</div><div class="muted" style="margin-bottom:8px">${t('r1')}</div>
  <button class="btn g" onclick="S.ok18=true;save();closeModal();if(!S.intro)intro(0)">${t('agree')}</button>`,true)}

// Знакомство. Восемь первых людей сказали одно и то же: «глаза разбегаются».
// Поэтому сначала три коротких экрана — зачем мы здесь и с чего начать, — и
// сразу в SHR, а не в игру: деньги считать полезнее, чем угадывать.
const INTRO=[['in1_h','in1_d'],['in2_h','in2_d'],['in3_h','in3_d']];
function intro(i){
  const last=i>=INTRO.length-1,x=INTRO[i];
  modal(`<div class="dots">${INTRO.map((_,n)=>`<i class="${n===i?'on':''}"></i>`).join('')}</div>
    ${i===0?`<img class="splash" src="${IMG.badge}" alt="SHRhub">`:''}
    <h2 style="margin:${i===0?'6px':'0'} 0 6px">${t(x[0])}</h2>
    <div class="muted" style="line-height:1.55;text-align:left">${t(x[1])}</div>
    <button class="btn g" onclick="${last?"introDone('calc')":'intro('+(i+1)+')'}">${t(last?'in_go':'in_next')}</button>
    <button class="btn ghost" onclick="introDone('game')">${t(last?'in_game':'in_skip')}</button>`,true);
}
function introDone(ch){S.intro=1;save();closeModal();go(ch)}
document.documentElement.lang=LOC[S.lang];
{const td=new Date().toISOString().slice(0,10);if(S.lastDay!==td){const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.days=S.lastDay===y?S.days+1:1;S.lastDay=td;save()}}
// Новое открытие приложения начинается с Play. Обновление страницы — нет:
// человек возвращается туда, где был. Различаем по sessionStorage: он живёт
// ровно столько, сколько открыто окно, и переживает обновление.
// Экраны владельца и открытую переписку не восстанавливаем: без загруженных
// данных они покажут пустоту.
S.ch='chats';
liteApply();fsApply();
try{
  const k=sessionStorage.getItem('shr_ch');
  if(k&&['gift','stats','tick','adm','pm'].indexOf(k)<0)S.ch=k;
}catch(e){}
if(S.lite&&LITE_OK.indexOf(S.ch)<0)S.ch='calc';
// Разовая уборка у тех, кто успел увидеть ботов. Вызываем её из ответа
// сервера: на этой строке связь ещё не установлена, и live() тут всегда ложь.
function dropBots(){
  if(S.nobots||!live())return;
  Object.keys(S.rooms||{}).forEach(k=>{S.rooms[k]=(S.rooms[k]||[]).filter(m=>m.me||m.id)});
  if(S.clan&&S.clan.chat)S.clan.chat=S.clan.chat.filter(m=>m.me);
  if(S.clan&&S.clan.members)S.clan.members=S.clan.members.filter(m=>m.me);
  // Коды, «использованные» выдуманными друзьями, возвращаем человеку.
  (S.codes||[]).forEach(c=>{c.used=false});
  S.friends=[];S.earn=0;S.nobots=1;save();render();
}
applyTheme();
// Выдуманную переписку в залах больше не показываем нигде: в чатах либо
// живые люди из Telegram, либо пусто.
setInterval(warTick,1000);setInterval(tbTick,500);setInterval(robotTick,1000);
// Настоящий рекорд клуба нужен сразу на главной, поэтому таблицу лидеров
// подтягиваем один раз при запуске, не дожидаясь, пока человек её откроет.
setTimeout(()=>{if(live())srvTop()},2500);
setInterval(tick,3000); // быстрый биржевой тикер
pullFiat();setInterval(pullFiat,120000); // курсы стейблкоинов и валют — раз в 2 минуты
// обмен с общим сервером: чат, настроение, кланы, рейтинг и сохранение прогресса
let SRVT=0;
setInterval(()=>{
  if(!live())return;
  if(typeof document!=='undefined'&&document.hidden)return;
  SRVT++;
  if(S.ch&&S.ch.indexOf('room:')===0)srvChat(S.ch);
  if(S.ch==='clan'&&S.clan&&S.clan.id)srvChat('clan:'+S.clan.id);
  if(SRVT%2===0)srvSent([...new Set([S.pred?S.pred.sym:S.coin,...COINS.slice(0,10).map(c=>c.s),...S.extra])].slice(0,20));
  if(SRVT%4===0)srvPush();
  if(SRVT%6===0){srvClans('');srvTop()}
},5000);
go(S.ch);draw();
if(!S.ok18)rules();else if(!S.intro)setTimeout(()=>intro(0),400);
</script>
