ot:["Место на виду", "Місце на видноті", "Spotlight"],lead_spot_d:["Можно купить место над таблицей на 7 дней. Оно всегда подписано «Место оплачено» и не меняет настоящий рейтинг: первая строчка таблицы остаётся за тем, кто её заработал.", "Можна купити місце над таблицею на 7 днів. Воно завжди підписане «Місце оплачено» і не змінює справжній рейтинг: перший рядок лишається за тим, хто його заробив.", "You can buy the slot above the table for 7 days. It is always labelled \"Paid placement\" and does not change the real standings: first place stays with whoever earned it."],lead_buy:["Моё место на виду: {0} ⭐", "Моє місце на видноті: {0} ⭐", "My spotlight: {0} ⭐"],lead_buyc:["Место для клана: {0} ⭐", "Місце для клану: {0} ⭐", "Spotlight for the clan: {0} ⭐"],lead_busy:["Место занято до {0}", "Місце зайняте до {0}", "Taken until {0}"],lead_busyc:["Клановое место занято до {0}", "Кланове місце зайняте до {0}", "Clan slot taken until {0}"],tg_chat:['Залы открыты, но людей в них нет: клуб собирается в Telegram. Открой SHRhub там — и те же залы будут с живыми собеседниками.','Зали відкриті, але людей у них немає: клуб збирається в Telegram. Відкрий SHRhub там — і ті самі зали будуть із живими співрозмовниками.','The rooms are open but empty: the club gathers in Telegram. Open SHRhub there and the same rooms come with real people.'],tg_clan:['Клан — это люди: общий чат, общий счёт и общие войны. Он собирается в Telegram, там же видно, кто в нём состоит. Здесь, без Telegram, собирать некого.','Клан — це люди: спільний чат, спільний рахунок і спільні війни. Він збирається в Telegram, там само видно, хто в ньому. Тут, без Telegram, збирати нема кого.','A clan is people: a shared chat, a shared score, shared wars. It is built in Telegram, where you can see who is in it. Here, without Telegram, there is nobody to gather.'],tg_need:['Это работает в Telegram: здесь нужны живые участники.','Це працює в Telegram: тут потрібні живі учасники.','This works in Telegram: it needs real members.'],tg_shop:['Оплата работает в Telegram — там же, где люди. Здесь всё открыто и так: считай средние цены, смотри графики, веди учёт. Платить не за что.','Оплата працює в Telegram — там само, де люди. Тут усе відкрито й так: рахуй середні ціни, дивись графіки, веди облік. Платити нема за що.','Payments work in Telegram, where the people are. Here everything is already open: averages, charts, your own records. There is nothing to pay for.'],lead_demo:['Этот раздел работает в Telegram: здесь нужны живые участники.','Цей розділ працює в Telegram: тут потрібні живі учасники.','This section works in Telegram: it needs real members.'],full_on:["Полный экран", "Повний екран", "Fullscreen"],full_off:["Обычный экран", "Звичайний екран", "Exit fullscreen"],ca_fix:["Исправить", "Виправити", "Fix"],ca_fix_d:["Дата покупки останется прежней: {0}. Если валюту не менять, курс тоже останется тот, что был в день записи.", "Дата покупки залишиться та сама: {0}. Якщо не змінювати валюту, курс теж лишиться той, що був у день запису.", "The purchase date stays as it was: {0}. Unless you change the currency, the rate from that day stays too."],ca_fixed:["Запись исправлена", "Запис виправлено", "Record fixed"],sale_d:["Скидка −{0}% на все покупки до {1}. Зачёркнута обычная цена — та, по которой покупают, когда скидки нет.", "Знижка −{0}% на всі покупки до {1}. Закреслена звичайна ціна — та, за якою купують, коли знижки немає.", "Everything is {0}% off until {1}. The struck-through number is the normal price — what people pay when there is no sale."],ann_h:["Что нового", "Що нового", "What is new"],ann_ok:["Понятно", "Зрозуміло", "Got it"],month:["мес", "міс", "mo"],pass_buy_p:["Открыть пропуск:", "Відкрити перепустку:", "Unlock the pass:"],sc_buy_p:["Открыть {0}:", "Відкрити {0}:", "Unlock {0}:"],tr_h:["Пробный доступ", "Пробний доступ", "Free trial"],tr_left:["осталось {0} дн.", "залишилось {0} дн.", "{0} days left"],tr_d:["Все функции открыты до {0}. Деньги не списываются, подписка сама не включится: когда срок кончится, ты просто вернёшься на бесплатный тариф, а записи SHR и прогресс останутся.", "Усі функції відкриті до {0}. Гроші не списуються, підписка сама не ввімкнеться: коли строк мине, ти просто повернешся на безкоштовний тариф, а записи SHR і прогрес залишаться.", "Everything is unlocked until {0}. Nothing is charged and no subscription starts by itself: when it ends you simply return to the free plan, and your SHR records and progress stay."],m_sp:["Спот", "Спот", "Spot"],m_ex:["Обмен", "Обмін", "Exchange"],m_bg:["Деньги", "Гроші", "Money"],ex_what:["Учёт обменных операций: по какому курсу брал валюту, по какому отдавал, сколько осталось в кассе и сколько на этом заработал.", "Облік обмінних операцій: за яким курсом брав валюту, за яким віддавав, скільки лишилось у касі й скільки на цьому заробив.", "A ledger for exchange operations: the rate you bought at, the rate you sold at, what is left in the till and what you earned on it."],ex_buy:["Взял", "Узяв", "Bought"],ex_sell:["Отдал", "Віддав", "Sold"],ex_gave:["Отдал", "Віддав", "Paid"],ex_got:["Получил", "Отримав", "Received"],ex_rate:["Курс: сколько {1} за 1 {0}", "Курс: скільки {1} за 1 {0}", "Rate: how much {1} per 1 {0}"],ex_add:["Записать покупку валюты", "Записати покупку валюти", "Save the purchase"],ex_adds:["Записать продажу валюты", "Записати продаж валюти", "Save the sale"],ex_avg:["средний курс", "середній курс", "average rate"],ex_have:["в кассе", "у касі", "in the till"],ex_in:["вложено", "вкладено", "tied up"],ex_earned:["Заработано:", "Зароблено:", "Earned:"],ex_at:["по", "по", "at"],ex_total:["Заработано всего", "Зароблено всього", "Total earned"],ex_hold:["Сейчас в валюте", "Зараз у валюті", "Currently in currency"],ex_none:["Пока пусто. Запиши первую операцию обмена.", "Поки порожньо. Запиши першу операцію обміну.", "Empty so far. Record your first exchange."],ex_note:["Это тетрадь для учёта, а не обменник. Операции ты проводишь сам, мы только считаем.", "Це зошит для обліку, а не обмінник. Операції ти проводиш сам, ми лише рахуємо.", "This is a ledger, not an exchange. You do the deals, we only count."],bg_what:["Расходы и приходы в твоих деньгах. По каждой валюте отдельно: сколько пришло, сколько ушло и сколько осталось.", "Витрати і надходження у твоїх грошах. По кожній валюті окремо: скільки прийшло, скільки пішло і скільки лишилось.", "Money in and out, in your own currencies. Each currency on its own: what came in, what went out, what is left."],bg_in:["Приход", "Надходження", "Income"],bg_out:["Расход", "Витрата", "Expense"],bg_note:["На что? Например: продукты, такси, зарплата", "На що? Наприклад: продукти, таксі, зарплата", "What for? e.g. groceries, taxi, salary"],bg_add:["Записать", "Записати", "Save"],bg_left:["Остаток", "Залишок", "Balance"],bg_sum:["Пришло: {0} · Ушло: {1}", "Прийшло: {0} · Пішло: {1}", "In: {0} · Out: {1}"],bg_log:["Записи", "Записи", "Entries"],bg_none:["Пока пусто. Запиши первый расход или приход.", "Поки порожньо. Запиши першу витрату чи надходження.", "Empty so far. Record your first entry."],bg_in_ok:["Приход записан", "Надходження записано", "Income saved"],bg_out_ok:["Расход записан", "Витрату записано", "Expense saved"],in1_h:["Это клуб, а не биржа", "Це клуб, а не біржа", "This is a club, not an exchange"],in1_d:["Мы ничего не продаём и не храним твои деньги. Здесь две вещи: считать свои покупки, чтобы видеть реальную картину, и угадывать, куда пойдёт цена — на очки, без ставок.", "Ми нічого не продаємо і не зберігаємо твої гроші. Тут дві речі: рахувати свої покупки, щоб бачити справжню картину, і вгадувати, куди піде ціна — на очки, без ставок.", "We sell nothing and hold none of your money. Two things live here: counting your own purchases so you see the real picture, and guessing where the price goes — for points, no betting."],in2_h:["Начни с SHR", "Почни з SHR", "Start with SHR"],in2_d:["SHR — твоя средняя цена входа. Записал покупки — и видно, по какой цене монеты реально достались, сколько денег ещё не вернулось и что выйдет, если докупить. Там же учёт обмена валют и обычные расходы с приходами.", "SHR — твоя середня ціна входу. Записав покупки — і видно, за якою ціною монети справді дісталися, скільки грошей ще не повернулося і що вийде, якщо докупити. Там само облік обміну валют і звичайні витрати з надходженнями.", "SHR is your average entry price. Record your purchases and you see what the coins really cost you, how much money has not come back, and what happens if you buy more. The same place holds currency exchange and everyday money."],in3_h:["Остальное подождёт", "Решта зачекає", "The rest can wait"],in3_d:["Прогнозы, серия, клан, чаты — всё это никуда не денется. Не пытайся освоить сразу: открой одну вкладку, разберись, иди дальше. Две недели всё открыто бесплатно, и мы ничего не спишем.", "Прогнози, серія, клан, чати — усе це нікуди не подінеться. Не намагайся освоїти одразу: відкрий одну вкладку, розберись, іди далі. Два тижні все відкрито безкоштовно, і ми нічого не спишемо.", "Forecasts, streaks, clans, chats — none of it is going anywhere. Do not try to learn it all at once: open one tab, get it, move on. Everything is free for two weeks and nothing is charged."],in_next:["Дальше", "Далі", "Next"],in_go:["Открыть SHR", "Відкрити SHR", "Open SHR"],in_skip:["Пропустить", "Пропустити", "Skip"],in_game:["Сначала осмотрюсь", "Спершу роздивлюсь", "I will look around first"],mz_h:["Как мы на этом зарабатываем", "Як ми на цьому заробляємо", "How we make money here"],mz_free_h:["Бесплатно навсегда:", "Безкоштовно назавжди:", "Free forever:"],mz_free:["все монеты и графики, калькулятор SHR, учёт обмена и расходов, прогнозы, чаты, клан. Цены мы берём с бирж — они публичные, брать за них деньги было бы странно.", "усі монети й графіки, калькулятор SHR, облік обміну та витрат, прогнози, чати, клан. Ціни ми беремо з бірж — вони публічні, брати за них гроші було б дивно.", "all coins and charts, the SHR calculator, exchange and expense tracking, forecasts, chats, clans. Prices come from public exchanges — charging for those would be odd."],mz_pay_h:["За звёзды:", "За зірки:", "Paid with Stars:"],mz_pay:["настроение клуба по монете, робот-помощник, спасение серии, большой клан, выгрузка записей в таблицу, оформление и значки, место на виду в таблице лидеров. Это надстройки — без них всё работает.", "настрій клубу за монетою, робот-помічник, порятунок серії, великий клан, вивантаження записів у таблицю, оформлення та значки, місце на видноті в таблиці лідерів. Це надбудови — без них усе працює.", "the club mood per coin, the robot helper, streak saves, a bigger clan, exporting records to a spreadsheet, skins and badges, a spotlight slot. These are add-ons — everything works without them."],mz_never_h:["Чего не будет никогда:", "Чого не буде ніколи:", "What will never happen:"],mz_never:["мы не торгуем твоими данными, не берём комиссию с твоих сделок, не храним твои деньги и не продаём сигналы «что купить». Приглашать друзей за деньги тоже не будем — это пирамида, а не клуб.", "ми не торгуємо твоїми даними, не беремо комісію з твоїх угод, не зберігаємо твої гроші й не продаємо сигнали «що купити». Запрошувати друзів за гроші теж не будемо — це піраміда, а не клуб.", "we do not sell your data, take no cut of your trades, hold none of your money and sell no \"what to buy\" signals. We will not pay people to recruit friends either — that is a pyramid, not a club."],ob_step:["Шаг {0} из {1}", "Крок {0} з {1}", "Step {0} of {1}"],ob_show:['Показать где','Показати де','Show me where'],ob_done:["Сделано", "Зроблено", "Done"],ob_here:["Это делается прямо здесь, ниже", "Це робиться просто тут, нижче", "You do this right here, below"],soon_bots:["Пока в клубе мало людей, этот режим закрыт. Он играется против соперников, а выдуманных соперников мы в настоящем клубе не показываем — откроем, когда наберётся достаточно живых игроков.", "Поки в клубі мало людей, цей режим закритий. Він грається проти суперників, а вигаданих суперників у справжньому клубі ми не показуємо — відкриємо, коли набереться достатньо живих гравців.", "This mode is closed while the club is small. It is played against opponents, and we do not show invented opponents in a real club — it opens when there are enough live players."],nw_mine:["Про твои монеты", "Про твої монети", "About your coins"],nw_all:["Что пишут", "Про що пишуть", "What they write"],nw_h_ago:["{0} ч назад", "{0} год тому", "{0} h ago"],nw_empty:["Пока пусто. Лента обновляется раз в 15 минут.", "Поки порожньо. Стрічка оновлюється раз на 15 хвилин.", "Empty for now. The feed refreshes every 15 minutes."],nw_src:["Заголовки изданий со ссылками на оригиналы. Мы не переписываем статьи и не проверяем их: читать идём к автору. Это не совет покупать или продавать.", "Заголовки видань із посиланнями на оригінали. Ми не переписуємо статті й не перевіряємо їх: читати йдемо до автора. Це не порада купувати чи продавати.", "Headlines from publishers, linked to the originals. We do not rewrite or fact-check them: read them at the source. This is not advice to buy or sell."],ex_how:["Как это заполнять", "Як це заповнювати", "How to fill this in"],ex_how1:["<b>Взял</b> — когда ты отдал свои деньги и получил валюту. Пример: отдал 45 000 ₴, взял 1000 USDT по курсу 45. В «Отдал» пиши 45 000, в «Курс» — 45.", "<b>Узяв</b> — коли ти віддав свої гроші й отримав валюту. Приклад: віддав 45 000 ₴, узяв 1000 USDT за курсом 45. У «Віддав» пиши 45 000, у «Курс» — 45.", "<b>Bought</b> — you paid your own money and received currency. Example: paid 45,000, bought 1,000 USDT at 45. Write 45,000 in \"Paid\" and 45 in \"Rate\"."],ex_how2:["<b>Отдал</b> — когда ты продал валюту и получил деньги обратно. Пример: продал 500 USDT по 46 и получил 23 000 ₴. В «Получил» пиши 23 000, в «Курс» — 46.", "<b>Віддав</b> — коли ти продав валюту й отримав гроші назад. Приклад: продав 500 USDT по 46 і отримав 23 000 ₴. У «Отримав» пиши 23 000, у «Курс» — 46.", "<b>Sold</b> — you sold currency and got money back. Example: sold 500 USDT at 46 and received 23,000. Write 23,000 in \"Received\" and 46 in \"Rate\"."],ex_how3:["Везде пиши суммы в своих деньгах — в тех, которыми считаешь кассу. Ничего переводить в доллары не надо.", "Усюди пиши суми у своїх грошах — у тих, якими рахуєш касу. Нічого переводити в долари не треба.", "Always write amounts in your own money — the one your till is counted in. No converting to dollars needed."],ex_hint_b:["Отдаёшь свои деньги, получаешь {0}. Сумму пиши в {1}, курс — сколько {1} за один {0}.", "Віддаєш свої гроші, отримуєш {0}. Суму пиши в {1}, курс — скільки {1} за один {0}.", "You pay your money and get {0}. Write the amount in {1}, and the rate as how much {1} per one {0}."],ex_hint_s:["Отдаёшь {0}, получаешь деньги. Сумму пиши в {1}, курс — по чём отдал.", "Віддаєш {0}, отримуєш гроші. Суму пиши в {1}, курс — по чому віддав.", "You give {0} and get money. Write the amount in {1}, and the rate you sold at."],ex_last:["Прошлый раз был курс {0} — подставил его, поправь если надо.", "Минулого разу був курс {0} — підставив його, виправ якщо треба.", "Last time the rate was {0} — filled it in, change it if needed."],ex_report:["Отчёт", "Звіт", "Report"],ex_today:["Сегодня", "Сьогодні", "Today"],ex_month:["Месяц", "Місяць", "Month"],ex_allt:["Всё время", "Увесь час", "All time"],ex_turn:["Оборот", "Оборот", "Turnover"],ex_ops:["Операций", "Операцій", "Operations"],ex_margin:["Маржа", "Маржа", "Margin"],ex_mrg_d:["Оборот — сколько денег прошло через руки. Заработок — что осталось после возврата своей же закупки. Маржа — заработок к сумме продаж.", "Оборот — скільки грошей пройшло через руки. Заробіток — що лишилося після повернення своєї ж закупівлі. Маржа — заробіток до суми продажів.", "Turnover is how much money passed through your hands. Earnings are what is left after your own purchase cost comes back. Margin is earnings against sales."],ex_till:["В кассе", "У касі", "In the till"],ex_till_d:["Сколько валюты у тебя на руках по записям. Если расходится с настоящей кассой — где-то пропущена операция.", "Скільки валюти в тебе на руках за записами. Якщо розходиться зі справжньою касою — десь пропущено операцію.", "How much currency you hold according to the records. If it differs from the real till, an operation is missing."],ex_more:["И ещё {0} записей", "І ще {0} записів", "And {0} more entries"],bg_what_h:["Как это работает", "Як це працює", "How this works"],nav_shop:["Shop", "Shop", "Shop"],ban_h:["Чат закрыт", "Чат закрито", "Chat closed"],ban_d:["Тебе закрыли доступ к чатам, новостям и клану. Калькулятор SHR и все твои записи на месте — их никто не трогал. Написать в поддержку можно, если считаешь, что это ошибка.", "Тобі закрили доступ до чатів, новин і клану. Калькулятор SHR і всі твої записи на місці — їх ніхто не чіпав. Написати в підтримку можна, якщо вважаєш це помилкою.", "Your access to chats, news and clans is closed. The SHR calculator and all your records are untouched. You can still write to support if you think this is a mistake."],ban_why:["Причина:", "Причина:", "Reason:"],ban_o_d:["Закроет человеку чаты, новости и клан. SHR и его записи останутся — это его деньги, а не наши. Поддержка тоже останется открытой, иначе он не сможет оспорить решение. Бот напишет ему причину.", "Закриє людині чати, новини і клан. SHR і її записи лишаться — це її гроші, а не наші. Підтримка теж лишиться відкритою, інакше вона не оскаржить рішення. Бот напише їй причину.", "Closes chats, news and clans for this person. SHR and their records stay — that is their money, not ours. Support stays open too, or they cannot appeal. The bot will tell them the reason."],ban_o_off:["Вернуть человеку доступ к чатам, новостям и клану. Бот сообщит ему об этом.", "Повернути людині доступ до чатів, новин і клану. Бот повідомить її про це.", "Restore access to chats, news and clans. The bot will let them know."],ban_o_ph:["За что? Человек это увидит", "За що? Людина це побачить", "Why? They will vd_h:['Видео','Відео','Videos'],vd_demo:['Видео работает в Telegram: ролики хранятся там.','Відео працює в Telegram: ролики зберігаються там.','Videos work in Telegram: that is where the files live.'],vd_feed:['Лента','Лента','Feed'],vd_mine:['Мои ролики','Мої ролики','My videos'],vd_how:['Как выложить ролик','Як виклаcти ролик','How to post a video'],vd_how_d:['Закрой приложение и отправь видео в этот же чат с ботом. Что напишешь в подписи — станет названием. Ролик сразу появится в ленте и на твоей странице.','Закрий застосунок і надішли відео в цей самий чат із ботом. Що напишеш у підписі — стане назвою. Ролик одразу з\'явиться в ленті й на твоїй сторінці.','Close the app and send the video to this same chat with the bot. The caption becomes the title. The video appears in the feed and on your page right away.'],vd_go:['Закрыть и отправить видео','Закрити й надіслати відео','Close and send a video'],vd_rule:['Правила и ответственность','Правила і відповідальність','Rules and responsibility'],vd_rule_d:['Нельзя: наркотики, оружие, насилие, чужие ролики и обещания дохода. Любой может нажать 🚩 — жалоба уходит владельцу клуба, и ролик могут снять с ленты. Автору при этом напишет бот.','Не можна: наркотики, зброя, насильство, чужі ролики й обіцянки доходу. Будь-хто може натиснути 🚩 — скарга йде власникові клубу, і ролик можуть зняти з ленти. Авторові про це напише бот.','Not allowed: drugs, weapons, violence, other people\'s videos and income promises. Anyone can tap 🚩 — the report goes to the club owner and the video can be taken down. The bot tells the author if it is.'],vd_none:['Роликов пока нет. Выложи первый.','Роликів поки немає. Виклади перший.','No videos yet. Post the first one.'],vd_mnone:['Ты ещё ничего не выкладывал.','Ти ще нічого не викладав.','You have not posted anything yet.'],vd_anon:['Участник','Учасник','Member'],vd_watch:['Смотреть','Дивитися','Watch'],vd_close:['Свернуть','Згорнути','Collapse'],vd_tochat:['Прислать в чат','Надіслати в чат','Send to chat'],vd_sent:['Бот прислал ролик в чат: он больше 20 МБ и в приложении не играет','Бот надіслав ролик у чат: він більший за 20 МБ і в застосунку не грає','The bot sent the video to your chat: it is over 20 MB and will not play in the app'],vd_rep_ok:['Жалоба отправлена владельцу клуба','Скаргу надіслано власникові клубу','Your report went to the club owner'],vd_del:['Удалить','Видалити','Delete'],vd_del_q:['Ролик и его просмотры исчезнут без возврата.','Ролик і його перегляди зникнуть без вороття.','The video and its view count disappear for good.'],vd_hide:['Снять с ленты','Зняти з ленти','Take down'],vd_show:['Вернуть в ленту','Повернути в ленту','Restore'],vd_hidden:['снят с ленты','знято з ленти','taken down'],vd_flags:['жалоб: {0}','скарг: {0}','reports: {0}'],vd_boost:['Поднять в топ','Підняти в топ','Boost'],vd_bst_h:['Поднять ролик в топ','Підняти ролик у топ','Boost the video'],vd_bst_d:['Семь дней ролик стоит первым в ленте. Просмотров это не обещает: его увидят раньше те, кто и так открыл ленту, а больше людей от этого не придёт.','Сім днів ролик стоїть першим у ленті. Переглядів це не обіцяє: його побачать раніше ті, хто й так відкрив ленту, а більше людей від цього не прийде.','For seven days the video sits first in the feed. It promises no views: people who open the feed see it sooner, but no extra people arrive.'],vd_bst_pay:['Ты платишь {0} ⭐ — примерно ${1} в магазине приложений. До клуба доходит около ${2}: разницу забирают Apple или Google и Telegram, не мы. Внутри SHRhub с тебя больше не снимают ничего.','Ти платиш {0} ⭐ — приблизно ${1} у магазині застосунків. До клубу доходить близько ${2}: різницю забирають Apple чи Google і Telegram, не ми. Усередині SHRhub з тебе більше не знімають нічого.','You pay {0} ⭐ — about ${1} in the app store. The club receives roughly ${2}: the gap goes to Apple or Google and Telegram, not to us. SHRhub takes nothing further from you.'],vd_bst_go:['Заплатить {0} ⭐','Заплатити {0} ⭐','Pay {0} ⭐'],vd_bst_done:['Ролик будет первым в ленте семь дней','Ролик буде першим у ленті сім днів','The video will lead the feed for seven days'],vd_bst_on:['в топе до {0}','у топі до {0}','on top until {0}'],vd_paid:['на продвижение: {0} ⭐','на просування: {0} ⭐','spent on boosts: {0} ⭐'],vd_s_vw:['просмотров','переглядів','views'],vd_s_lk:['нравится','вподобань','likes'],vd_s_n:['роликов','роликів','videos'],vd_s_sp:['потрачено','витрачено','spent'],
vd_add:['Выложить ролик','Викласти ролик','Post a video'],vd_long_h:['Ролик длиннее 1:20','Ролик довший за 1:20','The video is over 1:20'],vd_long_d:['В нём {0}, а в ленту выкладываются ролики до 1:20 — как в Instagram. Можем выложить первые 1:20.','У ньому {0}, а в стрічку викладаються ролики до 1:20 — як в Instagram. Можемо викласти перші 1:20.','It runs {0}; the feed takes videos up to 1:20, like Instagram. We can post the first 1:20.'],vd_long_go:['Выложить первые 1:20','Викласти перші 1:20','Post the first 1:20'],vd_long_s:['Ролик длиннее 1:20','Ролик довший за 1:20','The video is over 1:20'],vd_shrink_d:['Ролик {0} МБ. Перед загрузкой сожмём его до 720p, как в Instagram, — это займёт около {1}. Не закрывай приложение, пока идёт сжатие. Можно дать название — оно видно в ленте.','Ролик {0} МБ. Перед завантаженням стиснемо його до 720p, як в Instagram, — це займе близько {1}. Не закривай застосунок, поки йде стиснення. Можна дати назву — її видно в стрічці.','A {0} MB video. Before uploading we compress it to 720p, like Instagram — it takes about {1}. Keep the app open while it compresses. You can add a title — it shows in the feed.'],vd_shrinking:['Сжимаю ролик… {0}%','Стискаю ролик… {0}%','Compressing… {0}%'],vd_tap:['Телефон не дал запустить ролик. Нажми «Выложить» ещё раз.','Телефон не дав запустити ролик. Натисни «Викласти» ще раз.','The phone blocked playback. Tap Post once more.'],vd_cant:['Этот телефон не смог сжать ролик внутри приложения. Отправь его боту в чат — оттуда проходит любой размер.','Цей телефон не зміг стиснути ролик усередині застосунку. Надішли його боту в чат — звідти проходить будь-який розмір.','This phone could not compress the video in the app. Send it to the bot in the chat — any size goes through there.'],vd_new:['Новый ролик','Новий ролик','New video'],vd_new_d:['Ролик {0} МБ. Назови его — название увидят в ленте. Можно оставить пустым.','Ролик {0} МБ. Назви його — назву побачать у ленті. Можна лишити порожнім.','A {0} MB video. Give it a title — it shows in the feed. You can leave it empty.'],vd_title:['Название ролика','Назва ролика','Video title'],vd_post:['Выложить','Викласти','Post'],vd_sending:['Отправляю… {0}%','Надсилаю… {0}%','Uploading… {0}%'],vd_wait:['Почти готово, не закрывай приложение','Майже готово, не закривай застосунок','Almost there, keep the app open'],vd_ok:['Ролик в ленте','Ролик у ленті','Your video is in the feed'],vd_fail:['Не получилось отправить. Попробуй ещё раз.','Не вдалося надіслати. Спробуй ще раз.','Upload failed. Try again.'],vd_ban:['Доступ к клубу закрыт','Доступ до клубу закрито','Your club access is closed'],vd_big_h:['Ролик слишком большой','Ролик завеликий','The video is too large'],vd_big_d:['В нём {0} МБ, а отсюда проходит до 40 МБ. Такой ролик отправь боту в чат — оттуда он проходит любого размера.','У ньому {0} МБ, а звідси проходить до 40 МБ. Такий ролик надішли боту в чат — звідти він проходить будь-якого розміру.','It is {0} MB and this screen takes up to 40 MB. Send that one to the bot in chat instead — there the size does not matter.'],vd_big_s:['Ролик больше 40 МБ','Ролик більший за 40 МБ','The video is over 40 MB'],vd_rule_s:['Отвечает за ролик тот, кто его выложил. Запрещены наркотики, оружие, насилие, чужие видео и обещания дохода.','Відповідає за ролик той, хто його виклав. Заборонені наркотики, зброя, насильство, чужі відео й обіцянки доходу.','Whoever posts a video answers for it. Drugs, weapons, violence, other people\'s videos and income promises are not allowed.'],lg_h:['Правила и конфиденциальность','Правила і конфіденційність','Rules and privacy'],lg_open:['Правила и конфиденциальность','Правила і конфіденційність','Rules and privacy'],lg_1h:['Кто отвечает за ролик','Хто відповідає за ролик','Who answers for a video'],lg_1d:['Отвечает тот, кто выложил. Выкладывая ролик, ты подтверждаешь: ты снял его сам или у тебя есть разрешение автора; все, кто попал в кадр, не против съёмки; в ролике нет чужой музыки, фильмов и трансляций. SHRhub ролики не снимает и не заказывает.','Відповідає той, хто виклав. Викладаючи ролик, ти підтверджуєш: ти зняв його сам або маєш дозвіл автора; усі, хто потрапив у кадр, не проти зйомки; у ролику немає чужої музики, фільмів і трансляцій. SHRhub ролики не знімає і не замовляє.','Whoever posts it answers for it. By posting you confirm: you filmed it or have the author\'s permission; everyone on camera agreed to be filmed; it contains no one else\'s music, films or broadcasts. SHRhub neither films nor commissions videos.'],lg_2h:['Что запрещено','Що заборонено','What is not allowed'],lg_2d:['Наркотики, их продажа и изготовление. Оружие, взрывчатка, инструкции по их изготовлению. Насилие, жестокость, угрозы, издевательство над людьми и животными. Любое участие детей в сексуальном контексте. Призывы к вражде и насилию по любому признаку. Обещания дохода, «сигналы», сбор денег, пирамиды и любые схемы с чужими деньгами. Реклама фьючерсов, плеча и ставок. Чужие ролики. Личные данные других людей: адрес, телефон, документы, переписка, скриншоты чужих кабинетов.','Наркотики, їх продаж і виготовлення. Зброя, вибухівка, інструкції з їх виготовлення. Насильство, жорстокість, погрози, знущання з людей і тварин. Будь-яка участь дітей у сексуальному контексті. Заклики до ворожнечі й насильства за будь-якою ознакою. Обіцянки доходу, «сигнали», збір грошей, піраміди й будь-які схеми з чужими грошима. Реклама ф\'ючерсів, плеча і ставок. Чужі ролики. Особисті дані інших людей: адреса, телефон, документи, листування, скриншоти чужих кабінетів.','Drugs, their sale and production. Weapons, explosives, instructions for making them. Violence, cruelty, threats, abuse of people or animals. Any sexual context involving children. Incitement to hatred or violence on any grounds. Income promises, "signals", money collection, pyramids and any scheme involving other people\'s money. Ads for futures, leverage or betting. Other people\'s videos. Other people\'s personal data: address, phone, documents, private messages, screenshots of their accounts.'],lg_3h:['Что будет за нарушение','Що буде за порушення','What happens if a rule is broken'],lg_3d:['Ролик снимают с ленты, и бот пишет автору, за что. При повторе доступ к клубу закрывают: прогнозы, чаты и видео перестают работать, звёзды за уже купленное не возвращаются. Если в ролике признаки преступления против человека, мы передаём материалы по официальному запросу правоохранительных органов.','Ролик знімають з ленти, і бот пише авторові, за що. При повторі доступ до клубу закривають: прогнози, чати й відео перестають працювати, зірки за вже куплене не повертаються. Якщо в ролику ознаки злочину проти людини, ми передаємо матеріали за офіційним запитом правоохоронних органів.','The video is taken down and the bot tells the author why. On a repeat, club access is closed: forecasts, chats and videos stop working, and stars already spent are not refunded. If a video shows signs of a crime against a person, we hand the material over on an official law-enforcement request.'],lg_4h:['Жалоба и ответ на неё','Скарга і відповідь на неї','Reports and appeals'],lg_4d:['Под каждым чужим роликом есть 🚩. Жалоба уходит владельцу клуба, разбираем в течение суток. Если считаешь, что ролик сняли зря, ответь на сообщение бота — решение пересмотрим.','Під кожним чужим роликом є 🚩. Скарга йде власникові клубу, розбираємо протягом доби. Якщо вважаєш, що ролик зняли даремно, відповідай на повідомлення бота — рішення переглянемо.','Every video by someone else has a 🚩. The report goes to the club owner and we look at it within a day. If you think a takedown was wrong, reply to the bot\'s message and we will review it.'],lg_5h:['Если это твоя работа','Якщо це твоя робота','If the work is yours'],lg_5d:['Кто-то выложил твой ролик? Напиши в поддержку: название ролика и чем подтверждается авторство. Снимем без разбирательств, а при повторе закроем доступ тому, кто выложил.','Хтось виклав твій ролик? Напиши в підтримку: назву ролика і чим підтверджується авторство. Знімемо без тяганини, а при повторі закриємо доступ тому, хто виклав.','Did someone post your video? Write to support with the video\'s title and how your authorship is shown. We take it down without argument, and on a repeat we close the poster\'s access.'],lg_6h:['Какие данные мы храним','Які дані ми зберігаємо','What data we keep'],lg_6d:['Имя в клубе, аватар, язык и тему; прогнозы, очки и серию; записи твоего портфеля; сообщения в чатах; ролики и их просмотры; покупки за звёзды. Если ты заполнил карточку профиля — имя, город, день и месяц рождения и, по желанию, год. Телефон — только если ты сам его вписал; удалить его можно в любой момент. Твой номер в Telegram нужен только для того, чтобы узнавать тебя при входе и присылать уведомления. Мы не собираем геопозицию, документы, данные карт и список контактов. Оплату проводит Telegram: реквизиты карты к нам не попадают.','Ім\'я в клубі, аватар, мову і тему; прогнози, очки і серію; записи твого портфеля; повідомлення в чатах; ролики та їх перегляди; покупки за зірки. Якщо ти заповнив картку профілю — ім\'я, місто, день і місяць народження та, за бажанням, рік. Телефон — лише якщо ти сам його вписав; видалити його можна будь-коли. Твій номер у Telegram потрібен лише для того, щоб упізнавати тебе при вході й надсилати сповіщення. Ми не збираємо геопозицію, документи, дані карток і список контактів. Оплату проводить Telegram: реквізити картки до нас не потрапляють.','Your club name, avatar, language and theme; forecasts, points and streak; your portfolio records; chat messages; videos and their view counts; star purchases. If you fill in your profile card: name, city, birth day and month and, if you like, the year. A phone number only if you entered it yourself, and you can delete it any time. Your Telegram id is used only to recognise you at sign-in and to send notifications. We do not collect your location, documents, card details or contact list. Telegram handles payments: card details never reach us.'],lg_7h:['Сколько храним и как удалить','Скільки зберігаємо і як видалити','How long we keep it and how to delete it'],lg_7d:['Данные лежат, пока ты пользуешься клубом. Свои ролики удаляй кнопкой «Удалить» — исчезают сразу вместе с просмотрами. Весь остальной след стирает кнопка «Удалить мои данные» в профиле. Файлы роликов хранятся у Telegram: мы держим только ссылку на них, и после удаления ссылка перестаёт работать.','Дані лежать, доки ти користуєшся клубом. Свої ролики видаляй кнопкою «Видалити» — зникають одразу разом із переглядами. Увесь інший слід стирає кнопка «Видалити мої дані» в профілі. Файли роликів зберігаються в Telegram: ми тримаємо лише посилання на них, і після видалення посилання перестає працювати.','We keep your data while you use the club. Delete your own videos with the Delete button — they go at once, view counts included. Everything else is erased by "Delete my data" in your profile. Video files live at Telegram: we keep only a link to them, and after a delete that link stops working.'],lg_8h:['Возраст и деньги','Вік і гроші','Age and money'],lg_8d:['SHRhub с 18 лет. Это площадка для игры и учёта своих же покупок, а не биржа: здесь нельзя купить или продать криптовалюту. Ничего в клубе не является советом, что покупать, — ни прогнозы игроков, ни ролики, ни цифры в калькуляторе. Решение всегда твоё.','SHRhub з 18 років. Це майданчик для гри й обліку власних покупок, а не біржа: тут не можна купити або продати криптовалюту. Ніщо в клубі не є порадою, що купувати, — ні прогнози гравців, ні ролики, ні цифри в калькуляторі. Рішення завжди твоє.','SHRhub is 18+. It is a place to play and to track your own purchases, not an exchange: you cannot buy or sell crypto here. Nothing in the club is advice on what to buy — not player forecasts, not videos, not the calculator\'s numbers. The decision is always yours.'],lg_law:['Правила написаны простым языком и действуют всё время, пока ты пользуешься SHRhub. Если какой-то пункт расходится с законом твоей страны, действует закон.','Правила написані простою мовою й діють увесь час, поки ти користуєшся SHRhub. Якщо якийсь пункт розходиться із законом твоєї країни, діє закон.','These rules are written in plain language and apply for as long as you use SHRhub. Where a point conflicts with the law of your country, the law applies.'],

Object.assign(X[3],{ad_h:"App sections",ad_d:"A section you switch off disappears for every member: it is gone from the lists and cannot be opened. You always see every section — otherwise you could lock yourself out.",ad_off_n:"Sections off: {0}",ad_note:"Better to switch off what is not finished than to leave people buttons that do nothing.",ad_closed:"This section is closed right now",war_nobody:"Nobody to fight yet: it needs a second clan of real people.",ref_send:"Send to a friend",ref_copy:"Copy the link",ref_copied:"Link copied",ref_text:"Come into SHRhub — a club for counting your average entry price and guessing where the price goes. The code is already in the link.",ref_d:"The button opens your Telegram contacts — pick who to send it to. The code is already in the link, no need to dictate it.",code_used:"used",copied:"Copied",sp_sent:"Sent. The reply comes to your chat with the owner — it opens right here, under Chats.",sp_d:"The club owner answers, usually within the day. Your message opens a private chat with him and it carries on as a conversation. We give no advice on what to buy.",o_write_h:"The simplest way is to write",o_write_d:"Just say what you need in your own words. I reply with a price and a date right in the chat — faster than any form.",o_write:"Message {0}",o_owner:"the club owner",o_add:"Or leave a request",o_add_d:"If it is easier to write it all at once, fill this in. The request reaches me and we continue in the chat.",o_how1:"Someone writes to you in the chat, or leaves a request in this section.",o_how:"How it works",o_how1:"Someone opens this section and describes what they need: a site, a logo, a bot, anything.",o_how2:"The request lands in your bot with the full text, and a card appears here.",o_how3:"You tap Reply, give a price and a date. It reaches the person in their chat.",o_how4:"Then: talking → in progress → delivered. You tick paid for your own records.",o_how_n:"No requests yet simply means nobody knows the section exists. en it will be ready",o_set:"Reply",o_paid:"paid",o_unpaid:"mark unpaid",o_cancel:"Cancel the request",o_cancel_q:"The request closes. You can send a new one any time.",pr_gift_sent:"Paid — the bot is sending it",pr_gift:"Gift",pr_gift_to:"To: {0}",pr_gift_h:"A gift for {0}",pr_gift_note:"A line with the gift, if you like",pr_gift_sum:"The gift itself is {0} ⭐, the club takes {1} ⭐. You pay {2} ⭐ in total.",pr_gift_warn:"The gift lands in the person's Telegram profile and stays there. They cannot convert it back to stars — that is how gifts from bots work. If sending fails, you get every star back, the club's cut included.",pr_gift_go:"Pay {0} ⭐",pr_gift_none:"Telegram is not returning the gift list right now. Try later.",pr_gift_left:"{0} left",pr_gift_fee:"Each price includes {0} ⭐ for the club — that is what keeps SHRhub running. The rest goes to Telegram for the gift itself.",pm_pin:"Pin chat",pm_unpin:"Unpin",pr_open:"Open profile",pm_wipe_me:"Delete chat for me",pm_wipe_both:"Delete for both",pm_wipe_q1:"The chat disappears from your list. The other person keeps theirs, and if they write again the chat comes back.",pm_wipe_q2:"The whole chat disappears for you and for {0}. There is no way back.",pm_hold:"Press and hold a chat to delete it",nav_ideas:"Ideas",nav_back:"Club",nav_people:"People",nav_rooms:"Rooms",f_ph:"Find a member by name",pm_voice:"Voice",pm_rec:"Recording",pm_nomic:"The phone did not grant microphone access",pm_short:"Too short",pm_del:"Delete message",pm_del_q:"It disappears for both of you, with no way back.",ch_idea:"ideas",id_h:"Your ideas",id_add:"What should the club add?",id_add_d:"Tell us what is missing here. The owner reads every one and says what will happen to it. Back other people's ideas with the arrow — whatever gets the most votes gets built first.",id_ph:"For example: a reminder before a forecast closes",id_send:"Submit",id_sent:"Sent. The owner has it already.",id_empty:"Write what you suggest",id_slow:"One idea per hour. Think it over and come back.",id_none:"No ideas yet. Be first — these really do get read.",id_vote:"Back this",id_mark:"What happens to it",id_note:"A line to the author, if needed",id_soon:"in progress",id_done:"done",id_no:"not for now",id_clear:"Clear the mark",id_del_q:"The idea and its votes will be gone.",pm_find:"Search by name",pm_nofind:"Nobody found",pm_today:"Today",pm_yest:"Yesterday",pms_all:"All chats",pm_file:"Photo or video",pm_emoji:"Emoji",pm_photo:"Photo",pm_video:"Video",pm_bigp:"Photos over 10 MB do not go through",pm_bigv:"Videos over 40 MB do not go through",pm_toobig:"The video is over 20 MB — watch it in your chat with the bot",pm_h:"Chat",pms_h:"Chats",pms_none:"No chats yet. Tap a member and the chat opens.",pms_who:"Who is in the club now",pm_empty:"Nothing here yet. Write first.",pm_ph:"Message",pm_send:"Send",pm_you:"You:",pm_self:"That is you",pm_slow:"Too many messages at once. Wait a minute.",vd_rule:"Rules and responsibility",ch_legal:"privacy",vd_add:"Post a video",vd_new:"New video",vd_new_d:"A {0} MB video. Give it a title — it shows in the feed. You can leave it empty.",vd_title:"Video title",vd_post:"Post",vd_sending:"Uploading… {0}%",vd_wait:"Almost there, keep the app open",vd_ok:"Your video is in the feed",vd_fail:"Upload failed. Try again.",vd_ban:"Your club access is closed",vd_big_h:"The video is too large",vd_big_d:"It is {0} MB and this screen takes up to 40 MB. Send that one to the bot in chat instead — there the size does not matter.",vd_big_s:"The video is over 40 MB",vd_rule_s:"Whoever posts a video answers for it. Drugs, weapons, violence, other people's videos and income promises are not allowed.",lg_h:"Rules and privacy",lg_open:"Rules and privacy",lg_1h:"Who answers for a video",lg_1d:"Whoever posts it answers for it. By posting you confirm: you filmed it or have the author's permission; everyone on camera agreed to be filmed; it contains no one else's music, films or broadcasts. SHRhub neither films nor commissions videos.",lg_2h:"What is not allowed",lg_2d:"Drugs, their sale and production. Weapons, explosives, instructions for making them. Violence, cruelty, threats, abuse of people or animals. Any sexual context involving children. Incitement to hatred or violence on any grounds. Income promises, \"signals\", money collection, pyramids and any scheme involving other people's money. Ads for futures, leverage or betting. Other people's videos. Other people's personal data: address, phone, documents, private messages, screenshots of their accounts.",lg_3h:"What happens if a rule is broken",lg_3d:"The video is taken down and the bot tells the author why. On a repeat, club access is closed: forecasts, chats and videos stop working, and stars already spent are not refunded. If a video shows signs of a crime against a person, we hand the material over on an official law-enforcement request.",lg_4h:"Reports and appeals",lg_4d:"Every video by someone else has a 🚩. The report goes to the club owner and we look at it within a day. If you think a takedown was wrong, reply to the bot's message and we will review it.",lg_5h:"If the work is yours",lg_5d:"Did someone post your video? Write to support with the video's title and how your authorship is shown. We take it down without argument, and on a repeat we close the poster's access.",lg_6h:"What data we keep",lg_7h:"How long we keep it and how to delete it",lg_7d:"We keep your data while you use the club. Delete your own videos with the Delete button — they go at once, view counts included. Everything else is erased by \"Delete my data\" in your profile. Video files live at Telegram: we keep only a link to them, and after a delete that link stops working.",lg_8h:"Age and money",lg_8d:"SHRhub is 18+. It is a place to play and to track your own purchases, not an exchange: you cannot buy or sell crypto here. Nothing in the club is advice on what to buy — not player forecasts, not videos, not the calculator's numbers. The decision is always yours.",lg_law:"These rules are written in plain language and apply for as long as you use SHRhub. Where a point conflicts with the law of your country, the law applies.",vd_h:"Videos",vd_feed:"Feed",vd_mine:"My videos",vd_how:"How to post a video",vd_how_d:"Close the app and send the video to this same chat with the bot. The caption becomes the title. The video appears in the feed and on your page right away.",vd_go:"Close and send a video",vd_rule:"Video rules",vd_rule_d:"Not allowed: drugs, weapons, violence, other people's videos and income promises. Anyone can tap 🚩 — the report goes to the club owner and the video can be taken down. The bot tells the author if it is.",vd_none:"No videos yet. Post the first one.",vd_mnone:"You have not posted anything yet.",vd_anon:"Member",vd_watch:"Watch",vd_close:"Collapse",vd_tochat:"Send to chat",vd_sent:"The bot sent the video to your chat: it is over 20 MB and will not play in the app",vd_rep_ok:"Your report went to the club owner",vd_del:"Delete",vd_del_q:"The video and its view count disappear for good.",vd_hide:"Take down",vd_show:"Restore",vd_hidden:"taken down",vd_flags:"reports: {0}",vd_boost:"Boost",vd_bst_h:"Boost the video",vd_bst_d:"For seven days the video sits first in the feed. It promises no views: people who open the feed see it sooner, but no extra people arrive.",vd_bst_pay:"You pay {0} ⭐ — about ${1} in the app store. The club receives roughly ${2}: the gap goes to Apple or Google and Telegram, not to us. SHRhub takes nothing further from you.",vd_bst_go:"Pay {0} ⭐",vd_bst_done:"The video will lead the feed for seven days",vd_bst_on:"on top until {0}",vd_paid:"spent on boosts: {0} ⭐",vd_s_vw:"views",vd_s_lk:"likes",vd_s_n:"videos",vd_s_sp:"spent",f_coins:"Wszystkie monety, świece i kalkulator SHR",f_rb:"Robot prognoz: {0} dziennie",f_clan:"Klan do {0} osób",f_exp:"Historia transakcji SHR i eksport do arkusza",f_skins:"Motywy premium",ca_exp:"📤 Eksportuj transakcje",ca_expd:"Skopiuje wszystkie wpisy do en it will be ready",o_set:"Reply",o_paid:"paid",o_unpaid:"mark unpaid",o_cancel:"Cancel the request",o_cancel_q:"The request closes. You can send a new one any time.",pr_gift_sent:"Paid — the bot is sending it",pr_gift:"Gift",pr_gift_to:"To: {0}",pr_gift_h:"A gift for {0}",pr_gift_note:"A line with the gift, if you like",pr_gift_sum:"The gift itself is {0} ⭐, the club takes {1} ⭐. You pay {2} ⭐ in total.",pr_gift_warn:"The gift lands in the person's Telegram profile and stays there. They cannot convert it back to stars — that is how gifts from bots work. If sending fails, you get every star back, the club's cut included.",pr_gift_go:"Pay {0} ⭐",pr_gift_none:"Telegram is not returning the gift list right now. Try later.",pr_gift_left:"{0} left",pr_gift_fee:"Each price includes {0} ⭐ for the club — that is what keeps SHRhub running. The rest goes to Telegram for the gift itself.",pm_pin:"Pin chat",pm_unpin:"Unpin",pr_open:"Open profile",pm_wipe_me:"Delete chat for me",pm_wipe_both:"Delete for both",pm_wipe_q1:"The chat disappears from your list. The other person keeps theirs, and if they write again the chat comes back.",pm_wipe_q2:"The whole chat disappears for you and for {0}. There is no way back.",pm_hold:"Press and hold a chat to delete it",nav_ideas:"Ideas",nav_back:"Club",nav_people:"People",nav_rooms:"Rooms",f_ph:"Find a member by name",pm_voice:"Voice",pm_rec:"Recording",pm_nomic:"The phone did not grant microphone access",pm_short:"Too short",pm_del:"Delete message",pm_del_q:"It disappears for both of you, with no way back.",ch_idea:"ideas",id_h:"Your ideas",id_add:"What should the club add?",id_add_d:"Tell us what is missing here. The owner reads every one and says what will happen to it. Back other people's ideas with the arrow — whatever gets the most votes gets built first.",id_ph:"For example: a reminder before a forecast closes",id_send:"Submit",id_sent:"Sent. The owner has it already.",id_empty:"Write what you suggest",id_slow:"One idea per hour. Think it over and come back.",id_none:"No ideas yet. Be first — these really do get read.",id_vote:"Back this",id_mark:"What happens to it",id_note:"A line to the author, if needed",id_soon:"in progress",id_done:"done",id_no:"not for now",id_clear:"Clear the mark",id_del_q:"The idea and its votes will be gone.",pm_find:"Search by name",pm_nofind:"Nobody found",pm_today:"Today",pm_yest:"Yesterday",pms_all:"All chats",pm_file:"Photo or video",pm_emoji:"Emoji",pm_photo:"Photo",pm_video:"Video",pm_bigp:"Photos over 10 MB do not go through",pm_bigv:"Videos over 40 MB do not go through",pm_toobig:"The video is over 20 MB — watch it in your chat with the bot",pm_h:"Chat",pms_h:"Chats",pms_none:"No chats yet. Tap a member and the chat opens.",pms_who:"Who is in the club now",pm_empty:"Nothing here yet. Write first.",pm_ph:"Message",pm_send:"Send",pm_you:"You:",pm_self:"That is you",pm_slow:"Too many messages at once. Wait a minute.",vd_rule:"Rules and responsibility",ch_legal:"privacy",vd_add:"Post a video",vd_new:"New video",vd_new_d:"A {0} MB video. Give it a title — it shows in the feed. You can leave it empty.",vd_title:"Video title",vd_post:"Post",vd_sending:"Uploading… {0}%",vd_wait:"Almost there, keep the app open",vd_ok:"Your video is in the feed",vd_fail:"Upload failed. Try again.",vd_ban:"Your club access is closed",vd_big_h:"The video is too large",vd_big_d:"It is {0} MB and this screen takes up to 40 MB. Send that one to the bot in chat instead — there the size does not matter.",vd_big_s:"The video is over 40 MB",vd_rule_s:"Whoever posts a video answers for it. Drugs, weapons, violence, other people's videos and income promises are not allowed.",lg_h:"Rules and privacy",lg_open:"Rules and privacy",lg_1h:"Who answers for a video",lg_1d:"Whoever posts it answers for it. By posting you confirm: you filmed it or have the author's permission; everyone on camera agreed to be filmed; it contains no one else's music, films or broadcasts. SHRhub neither films nor commissions videos.",lg_2h:"What is not allowed",lg_2d:"Drugs, their sale and production. Weapons, explosives, instructions for making them. Violence, cruelty, threats, abuse of people or animals. Any sexual context involving children. Incitement to hatred or violence on any grounds. Income promises, \"signals\", money collection, pyramids and any scheme involving other people's money. Ads for futures, leverage or betting. Other people's videos. Other people's personal data: address, phone, documents, private messages, screenshots of their accounts.",lg_3h:"What happens if a rule is broken",lg_3d:"The video is taken down and the bot tells the author why. On a repeat, club access is closed: forecasts, chats and videos stop working, and stars already spent are not refunded. If a video shows signs of a crime against a person, we hand the material over on an official law-enforcement request.",lg_4h:"Reports and appeals",lg_4d:"Every video by someone else has a 🚩. The report goes to the club owner and we look at it within a day. If you think a takedown was wrong, reply to the bot's message and we will review it.",lg_5h:"If the work is yours",lg_5d:"Did someone post your video? Write to support with the video's title and how your authorship is shown. We take it down without argument, and on a repeat we close the poster's access.",lg_6h:"What data we keep",lg_7h:"How long we keep it and how to delete it",lg_7d:"We keep your data while you use the club. Delete your own videos with the Delete button — they go at once, view counts included. Everything else is erased by \"Delete my data\" in your profile. Video files live at Telegram: we keep only a link to them, and after a delete that link stops working.",lg_8h:"Age and money",lg_8d:"SHRhub is 18+. It is a place to play and to track your own purchases, not an exchange: you cannot buy or sell crypto here. Nothing in the club is advice on what to buy — not player forecasts, not videos, not the calculator's numbers. The decision is always yours.",lg_law:"These rules are written in plain language and apply for as long as you use SHRhub. Where a point conflicts with the law of your country, the law applies.",vd_h:"Videos",vd_feed:"Feed",vd_mine:"My videos",vd_how:"How to post a video",vd_how_d:"Close the app and send the video to this same chat with the bot. The caption becomes the title. The video appears in the feed and on your page right away.",vd_go:"Close and send a video",vd_rule:"Video rules",vd_rule_d:"Not allowed: drugs, weapons, violence, other people's videos and income promises. Anyone can tap 🚩 — the report goes to the club owner and the video can be taken down. The bot tells the author if it is.",vd_none:"No videos yet. Post the first one.",vd_mnone:"You have not posted anything yet.",vd_anon:"Member",vd_watch:"Watch",vd_close:"Collapse",vd_tochat:"Send to chat",vd_sent:"The bot sent the video to your chat: it is over 20 MB and will not play in the app",vd_rep_ok:"Your report went to the club owner",vd_del:"Delete",vd_del_q:"The video and its view count disappear for good.",vd_hide:"Take down",vd_show:"Restore",vd_hidden:"taken down",vd_flags:"reports: {0}",vd_boost:"Boost",vd_bst_h:"Boost the video",vd_bst_d:"For seven days the video sits first in the feed. It promises no views: people who open the feed see it sooner, but no extra people arrive.",vd_bst_pay:"You pay {0} ⭐ — about ${1} in the app store. The club receives roughly ${2}: the gap goes to Apple or Google and Telegram, not to us. SHRhub takes nothing further from you.",vd_bst_go:"Pay {0} ⭐",vd_bst_done:"The video will lead the feed for seven days",vd_bst_on:"on top until {0}",vd_paid:"spent on boosts: {0} ⭐",vd_s_vw:"views",vd_s_lk:"likes",vd_s_n:"videos",vd_s_sp:"spent",f_coins:"Alle Coins, Kerzen und der SHR-Rechner",f_rb:"Prognose-Roboter: {0} pro Tag",f_clan:"Clan bis {0} Mitglieder",f_exp:"SHR-Handelsverlauf und Export in eine Tabelle",f_skins:"Premium-Designs",ca_exp:"📤 Trades exportieren",ca_expd:"Kopiert alle Einträge Object.assign(X[5],{ad_h:"App sections",ad_d:"A section you switch off disappears for every member: it is gone from the lists and cannot be opened. You always see every section — otherwise you could lock yourself out.",ad_off_n:"Sections off: {0}",ad_note:"Better to switch off what is not finished than to leave people buttons that do nothing.",ad_closed:"This section is closed right now",war_nobody:"Nobody to fight yet: it needs a second clan of real people.",ref_send:"Send to a friend",ref_copy:"Copy the link",ref_copied:"Link copied",ref_text:"Come into SHRhub — a club for counting your average entry price and guessing where the price goes. The code is already in the link.",ref_d:"The button opens your Telegram contacts — pick who to send it to. The code is already in the link, no need to dictate it.",code_used:"used",copied:"Copied",sp_sent:"Sent. The reply comes to your chat with the owner — it opens right here, under Chats.",sp_d:"The club owner answers, usually within the day. Your message opens a private chat with him and it carries on as a conversation. We give no advice on what to buy.",o_write_h:"The simplest way is to write",o_write_d:"Just say what you need in your own words. I reply with a price and a date right in the chat — faster than any form.",o_write:"Message {0}",o_owner:"the club owner",o_add:"Or leave a request",o_add_d:"If it is easier to write it all at once, fill this in. The request reaches me and we continue in the chat.",o_how1:"Someone writes to you in the chat, or leaves a request in this section.",o_how:"How it works",o_how1:"Someone opens this section and describes what they need: a site, a logo, a bot, anything.",o_how2:"The request lands in your bot with the full text, and a card appears here.",o_how3:"You tap Reply, give a price and a date. It reaches the person in their chat.",o_how4:"Then: talking → in progress → delivered. You tick paid for your own records.",o_how_n:"No requests yet simply means nobody knows the section exists. Tell members they can order work here.",o_tell:"Tell everyone about it",o_tile:"Order a site, a logo or a bot",cd_tile:"Name, city, birthday",id_tile:"What the club should add",cd_ph_wait:"Telegram is sharing the number — one moment",m1:"January",m2:"February",m3:"March",m4:"April",m5:"May",m6:"June",m7:"July",m8:"August",m9:"September",m10:"October",m11:"November",m12:"December",cd_h:"My card",cd_d:"Other members see this on your profile. Nothing here is required.",cd_name:"Your name, how to address you",cd_city:"City",cd_bday:"Birthday",cd_month:"Month",cd_day:"Day",cd_bshow:"Show my birthday and let people wish me well",cd_phone:"Phone",cd_ph_add:"Share my number via Telegram",cd_ph_who:"Who sees the number",cd_ph_no:"Nobody",cd_ph_own:"The club owner only",cd_ph_club:"Every member of the club",cd_ph_del:"Delete the number",cd_ph_off:"Number deleted",cd_save:"Save",cd_saved:"Saved",al_h:"Rename",al_d:"The name this person has in your list. Only you see it — they never find out. Leave it empty to bring back their real name.",o_h:"Orders",o_add:"Need something built?",o_add_d:"Describe what you need. The request goes to the club owner, who replies with a price and a date right in the chat.",o_title_ph:"In a few words: what you need",o_text_ph:"In detail: what for, examples you like, when you need it",o_budget_ph:"Budget, if you have one: e.g. $300",o_send:"Send the request",o_money:"The app takes no payments and stores no card details. How you pay is between the two of you.",o_sent:"Request sent. The reply comes to your chat.",o_empty:"Fill in what you need and the details",o_slow:"One request per ten minutes",o_none:"No requests yet. Send the first — it commits you to nothing.",o_none_own:"No requests have come in yet.",o_mine:"My requests",o_all:"All requests",o_new:"new",o_talk:"talking",o_work:"in progress",o_done:"delivered",o_no:"cancelled",o_budget:"budget: {0}",o_price:"Price: {0}",o_price_ph:"Price: e.g. $300 or ₴12,000",o_note_ph:"What is included and when it will be ready",o_set:"Reply",o_paid:"paid",o_unpaid:"mark unpaid",o_cancel:"Cancel the request",o_cancel_q:"The request closes. You can send a new one any time.",pr_gift_sent:"Paid — the bot is sending it",pr_gift:"Gift",pr_gift_to:"To: {0}",pr_gift_h:"A gift for {0}",pr_gift_note:"A line with the gift, if you like",pr_gift_sum:"The gift itself is {0} ⭐, the club takes {1} ⭐. You pay {2} ⭐ in total.",pr_gift_warn:"The gift lands in the person's Telegram profile and stays there. They cannot convert it back to stars — that is how gifts from bots work. If sending fails, you get every star back, the club's cut included.",pr_gift_go:"Pay {0} ⭐",pr_gift_none:"Telegram is not returning the gift list right now. Try later.",pr_gift_left:"{0} left",pr_gift_fee:"Each price includes {0} ⭐ for the club — that is what keeps SHRhub running. The rest goes to Telegram for the gift itself.",pm_pin:"Pin chat",pm_unpin:"Unpin",pr_open:"Open profile",pm_wipe_me:"Delete chat for me",pm_wipe_both:"Delete for both",pm_wipe_q1:"The chat disappears from your list. The other person keeps theirs, and if they write again the chat comes back.",pm_wipe_q2:"The whole chat disappears for you and for {0}. There is no way back.",pm_hold:"Press and hold a chat to delete it",nav_ideas:"Ideas",nav_back:"Club",nav_people:"People",nav_rooms:"Rooms",f_ph:"Find a member by name",pm_voice:"Voice",pm_rec:"Recording",pm_nomic:"The phone did not grant microphone access",pm_short:"Too short",pm_del:"Delete message",pm_del_q:"It disappears for both of you, with no way back.",ch_idea:"ideas",id_h:"Your ideas",id_add:"What should the club add?",id_add_d:"Tell us what is missing here. The owner reads every one and says what will happen to it. Back other people's ideas with the arrow — whatever gets the most votes gets built first.",id_ph:"For example: a reminder before a forecast closes",id_send:"Submit",id_sent:"Sent. The owner has it already.",id_empty:"Write what you suggest",id_slow:"One idea per hour. Think it over and come back.",id_none:"No ideas yet. Be first — these really do get read.",id_vote:"Back this",id_mark:"What happens to it",id_note:"A line to the author, if needed",id_soon:"in progress",id_done:"done",id_no:"not for now",id_clear:"Clear the mark",id_del_q:"The idea and its votes will be gone.",pm_find:"Search by name",pm_nofind:"Nobody found",pm_today:"Today",pm_yest:"Yesterday",pms_all:"All chats",pm_file:"Photo or video",pm_emoji:"Emoji",pm_photo:"Photo",pm_video:"Video",pm_bigp:"Photos over 10 MB do not go through",pm_bigv:"Videos over 40 MB do not go through",pm_toobig:"The video is over 20 MB — watch it in your chat with the bot",pm_h:"Chat",pms_h:"Chats",pms_none:"No chats yet. Tap a member and the chat opens.",pms_who:"Who is in the club now",pm_empty:"Nothing here yet. Write first.",pm_ph:"Message",pm_send:"Send",pm_you:"You:",pm_self:"That is you",pm_slow:"Too many messages at once. Wait a minute.",vd_rule:"Rules and responsibility",ch_legal:"privacy",vd_add:"Post a video",vd_new:"New video",vd_new_d:"A {0} MB video. Give it a title — it shows in the feed. You can leave it empty.",vd_title:"Video title",vd_post:"Post",vd_sending:"Uploading… {0}%",vd_wait:"Almost there, keep the app open",vd_ok:"Your video is in the feed",vd_fail:"Upload failed. Try again.",vd_ban:"Your club access is closed",vd_big_h:"The video is too large",vd_big_d:"It is {0} MB and this screen takes up to 40 MB. Send that one to the bot in chat instead — there the size does not matter.",vd_big_s:"The video is over 40 MB",vd_rule_s:"Whoever posts a video answers for it. Drugs, weapons, violence, other people's videos and income promises are not allowed.",lg_h:"Rules and privacy",lg_open:"Rules and privacy",lg_1h:"Who answers for a video",lg_1d:"Whoever posts it answers for it. By posting you confirm: you filmed it or have the author's permission; everyone on camera agreed to be filmed; it contains no one else's music, films or broadcasts. SHRhub neither films nor commissions videos.",lg_2h:"What is not allowed",lg_2d:"Drugs, their sale and production. Weapons, explosives, instructions for making them. Violence, cruelty, threats, abuse of people or animals. Any sexual context involving children. Incitement to hatred or violence on any grounds. Income promises, \"signals\", money collection, pyramids and any scheme involving other people's money. Ads for futures, leverage or betting. Other people's videos. Other people's personal data: address, phone, documents, private messages, screenshots of their accounts.",lg_3h:"What happens if a rule is broken",lg_3d:"The video is taken down and the bot tells the author why. On a repeat, club access is closed: forecasts, chats and videos stop working, and stars already spent are not refunded. If a video shows signs of a crime against a person, we hand the material over on an official law-enforcement request.",lg_4h:"Reports and appeals",lg_4d:"Every video by someone else has a 🚩. The report goes to the club owner and we look at it within a day. If you think a takedown was wrong, reply to the bot's message and we will review it.",lg_5h:"If the work is yours",lg_5d:"Did someone post your video? Write to support with the video's title and how your authorship is shown. We take it down without argument, and on a repeat we close the poster's access.",lg_6h:"What data we keep",lg_7h:"How long we keep it and how to delete it",lg_7d:"We keep your data while you use the club. Delete your own videos with the Delete button — they go at once, view counts included. Everything else is erased by \"Delete my data\" in your profile. Video files live at Telegram: we keep only a link to them, and after a delete that link stops working.",lg_8h:"Age and money",lg_8d:"SHRhub is 18+. It is a place to play and to track your own purchases, not an exchange: you cannot buy or sell crypto here. Nothing in the club is advice on what to buy — not player forecasts, not videos, not the calculator's numbers. The decision is always yours.",lg_law:"These rules are written in plain language and apply for as long as you use SHRhub. Where a point conflicts with the law of your country, the law applies.",vd_h:"Videos",vd_feed:"Feed",vd_mine:"My videos",vd_how:"How to post a video",vd_how_d:"Close the app and send the video to this same chat with the bot. The caption becomes the title. The video appears in the feed and on your page right away.",vd_go:"Close and send a video",vd_rule:"Video rules",vd_rule_d:"Not allowed: drugs, weapons, violence, other people's videos and income promises. Anyone can tap 🚩 — the report goes to the club owner and the video can be taken down. The bot tells the author if it is.",vd_none:"No videos yet. Post the first one.",vd_mnone:"You have not posted anything yet.",vd_anon:"Member",vd_watch:"Watch",vd_close:"Collapse",vd_tochat:"Send to chat",vd_sent:"The bot sent the video to your chat: it is over 20 MB and will not play in the app",vd_rep_ok:"Your report went to the club owner",vd_del:"Delete",vd_del_q:"The video and its view count disappear for good.",vd_hide:"Take down",vd_show:"Restore",vd_hidden:"taken down",vd_flags:"reports: {0}",vd_boost:"Boost",vd_bst_h:"Boost the video",vd_bst_d:"For seven days the video sits first in the feed. It promises no views: people who open the feed see it sooner, but no extra people arrive.",vd_bst_pay:"You pay {0} ⭐ — about ${1} in the app store. The club receives roughly ${2}: the gap goes to Apple or Google and Telegram, not to us. SHRhub takes nothing further from you.",vd_bst_go:"Pay {0} ⭐",vd_bst_done:"The video will lead the feed for seven days",vd_bst_on:"on top until {0}",vd_paid:"spent on boosts: {0} ⭐",vd_s_vw:"views",vd_s_lk:"likes",vd_s_n:"videos",vd_s_sp:"spent",f_coins:"Todas las monedas, velas y la calculadora SHR",f_rb:"Robot de pronósticos: {0} al día",f_clan:"Clan de hasta {0} personas",f_exp:"Historial de operaciones SHR y exportación a hoja de cálculo",f_skins:"Temas premium",ca_exp:"📤 Exportar operaciones",ca nk it over and come back.",id_none:"No ideas yet. Be first — these really do get read.",id_vote:"Back this",id_mark:"What happens to it",id_note:"A line to the author, if needed",id_soon:"in progress",id_done:"done",id_no:"not for now",id_clear:"Clear the mark",id_del_q:"The idea and its votes will be gone.",pm_find:"Search by name",pm_nofind:"Nobody found",pm_today:"Today",pm_yest:"Yesterday",pms_all:"All chats",pm_file:"Photo or video",pm_emoji:"Emoji",pm_photo:"Photo",pm_video:"Video",pm_bigp:"Photos over 10 MB do not go through",pm_bigv:"Videos over 40 MB do not go through",pm_toobig:"The video is over 20 MB — watch it in your chat with the bot",pm_h:"Chat",pms_h:"Chats",pms_none:"No chats yet. Tap a member and the chat opens.",pms_who:"Who is in the club now",pm_empty:"Nothing here yet. Write first.",pm_ph:"Message",pm_send:"Send",pm_you:"You:",pm_self:"That is you",pm_slow:"Too many messages at once. Wait a minute.",vd_rule:"Rules and responsibility",ch_legal:"privacy",vd_add:"Post a video",vd_new:"New video",vd_new_d:"A {0} MB video. Give it a title — it shows in the feed. You can leave it empty.",vd_title:"Video title",vd_post:"Post",vd_sending:"Uploading… {0}%",vd_wait:"Almost there, keep the app open",vd_ok:"Your video is in the feed",vd_fail:"Upload failed. Try again.",vd_ban:"Your club access is closed",vd_big_h:"The video is too large",vd_big_d:"It is {0} MB and this screen takes up to 40 MB. Send that one to the bot in chat instead — there the size does not matter.",vd_big_s:"The video is over 40 MB",vd_rule_s:"Whoever posts a video answers for it. Drugs, weapons, violence, other people's videos and income promises are not allowed.",lg_h:"Rules and privacy",lg_open:"Rules and privacy",lg_1h:"Who answers for a video",lg_1d:"Whoever posts it answers for it. By posting you confirm: you filmed it or have the author's permission; everyone on camera agreed to be filmed; it contains no one else's music, films or broadcasts. SHRhub neither films nor commissions videos.",lg_2h:"What is not allowed",lg_2d:"Drugs, their sale and production. Weapons, explosives, instructions for making them. Violence, cruelty, threats, abuse of people or animals. Any sexual context involving children. Incitement to hatred or violence on any grounds. Income promises, \"signals\", money collection, pyramids and any scheme involving other people's money. Ads for futures, leverage or betting. Other people's videos. Other people's personal data: address, phone, documents, private messages, screenshots of their accounts.",lg_3h:"What happens if a rule is broken",lg_3d:"The video is taken down and the bot tells the author why. On a repeat, club access is closed: forecasts, chats and videos stop working, and stars already spent are not refunded. If a video shows signs of a crime against a person, we hand the material over on an official law-enforcement request.",lg_4h:"Reports and appeals",lg_4d:"Every video by someone else has a 🚩. The report goes to the club owner and we look at it within a day. If you think a takedown was wrong, reply to the bot's message and we will review it.",lg_5h:"If the work is yours",lg_5d:"Did someone post your video? Write to support with the video's title and how your authorship is shown. We take it down without argument, and on a repeat we close the poster's access.",lg_6h:"What data we keep",lg_7h:"How long we keep it and how to delete it",lg_7d:"We keep your data while you use the club. Delete your own videos with the Delete button — they go at once, view counts included. Everything else is erased by \"Delete my data\" in your profile. Video files live at Telegram: we keep only a link to them, and after a delete that link stops working.",lg_8h:"Age and money",lg_8d:"SHRhub is 18+. It is a place to play and to track your own purchases, not an exchange: you cannot buy or sell crypto here. Nothing in the club is advice on what to buy — not player forecasts, not videos, not the calculator's numbers. The decision is always yours.",lg_law:"These rules are written in plain language and apply for as long as you use SHRhub. Where a point conflicts with the law of your country, the law applies.",vd_h:"Videos",vd_feed:"Feed",vd_mine:"My videos",vd_how:"How to post a video",vd_how_d:"Close the app and send the video to this same chat with the bot. The caption becomes the title. The video appears in the feed and on your page right away.",vd_go:"Close and send a video",vd_rule:"Video rules",vd_rule_d:"Not allowed: drugs, weapons, violence, other people's videos and income promises. Anyone can tap 🚩 — the report goes to the club owner and the video can be taken down. The bot tells the author if it is.",vd_none:"No videos yet. Post the first one.",vd_mnone:"You have not posted anything yet.",vd_anon:"Member",vd_watch:"Watch",vd_close:"Collapse",vd_tochat:"Send to chat",vd_sent:"The bot sent the video to your chat: it is over 20 MB and will not play in the app",vd_rep_ok:"Your report went to the club owner",vd_del:"Delete",vd_del_q:"The video and its view count disappear for good.",vd_hide:"Take down",vd_show:"Restore",vd_hidden:"taken down",vd_flags:"reports: {0}",vd_boost:"Boost",vd_bst_h:"Boost the video",vd_bst_d:"For seven days the video sits first in the feed. It promises no views: people who open the feed see it sooner, but no extra people arrive.",vd_bst_pay:"You pay {0} ⭐ — about ${1} in the app store. The club receives roughly ${2}: the gap goes to Apple or Google and Telegram, not to us. SHRhub takes nothing further from you.",vd_bst_go:"Pay {0} ⭐",vd_bst_done:"The video will lead the feed for seven days",vd_bst_on:"on top until {0}",vd_paid:"spent on boosts: {0} ⭐",vd_s_vw:"views",vd_s_lk:"likes",vd_s_n:"videos",vd_s_sp:"spent",f_coins:"Tüm coinler, mumlar ve SHR hesaplayıcı",f_rb:"Tahmin robotu: günde {0}",f_clan:"{0} kişiye kadar klan",f_exp:"SHR işlem geçmişi ve tabloya aktarma",f_skins:"Premium temalar",ca_exp:"📤 İşlemleri dışa aktar",ca_expd:"Tüm kayıtları panoya kopyalar — Exc s già spese non vengono rimborsate. Se un video mostra segni di un reato contro una persona, consegniamo il materiale su richiesta ufficiale delle forze dell'ordine.", "lg_4h": "Segnalazioni e ricorsi", "lg_4d": "Ogni video altrui ha il simbolo 🚩. La segnalazione va al proprietario del club e la esaminiamo entro un giorno. Se pensi che una rimozione sia sbagliata, rispondi al messaggio del bot e la riesamineremo.", "lg_5h": "Se l'opera è tua", "lg_5d": "Qualcuno ha pubblicato un tuo video? Scrivi al supporto con il titolo del video e come si dimostra che è tuo. Lo rimuoviamo senza discussioni e, alla seconda volta, chiudiamo l'accesso a chi l'ha pubblicato.", "lg_6h": "Quali dati conserviamo", "lg_6d": "Il tuo nome nel club, l'avatar, la lingua e il tema; previsioni, punti e serie; le registrazioni del portafoglio; i messaggi nelle chat; i video e le loro visualizzazioni; gli acquisti in Stars. Se compili la scheda del profilo: nome, città, giorno e mese di nascita e, se vuoi, l'anno. Il telefono solo se lo inserisci tu, e puoi cancellarlo quando vuoi. Il tuo ID Telegram serve solo a riconoscerti all'accesso e a mandarti notifiche. Non raccogliamo posizione, documenti, dati della carta né la rubrica. I pagamenti li gestisce Telegram: i dati della carta non arrivano mai a noi.", "lg_7h": "Per quanto tempo li conserviamo e come cancellarli", "lg_7d": "Conserviamo i tuoi dati finché usi il club. I tuoi video si cancellano con il pulsante Elimina: spariscono subito, visualizzazioni comprese. Tutto il resto si cancella con «Elimina i miei dati» nel profilo. I file video sono su Telegram: noi conserviamo solo un link, che dopo la cancellazione smette di funzionare.", "lg_8h": "Età e denaro", "lg_8d": "SHRhub è per maggiori di 18 anni. È un posto per giocare e tenere conto dei tuoi acquisti, non una borsa: qui non si compra né si vende cripto. Niente nel club è un consiglio su cosa comprare: né le previsioni dei giocatori, né i video, né i numeri del calcolatore. La decisione è sempre tua.", "lg_law": "Queste regole sono scritte in un linguaggio semplice e valgono finché usi SHRhub. Se un punto è in contrasto con la legge del tuo paese, vale la legge.", "pm_h": "Chat", "pms_h": "Chat", "pms_none": "Ancora nessuna chat. Tocca un membro e la chat si apre.", "pms_who": "Chi c'è nel club adesso", "pm_empty": "Qui non c'è ancora niente. Scrivi tu per primo.", "pm_ph": "Messaggio", "pm_send": "Invia", "pm_you": "Tu:", "pm_self": "Sei tu", "pm_slow": "Troppi messaggi in una volta. Aspetta un minuto.", "pm_note": "Se la persona non è nell'app in questo momento, il bot le dirà su Telegram che le hai scritto. Leggerà il messaggio qui, quando torna.", "pms_all": "Tutte le chat", "pm_file": "Foto o video", "pm_emoji": "Emoji", "pm_photo": "Foto", "pm_video": "Video", "pm_bigp": "Le foto oltre i 10 MB non passano", "pm_bigv": "I video oltre i 40 MB non passano", "pm_toobig": "Il video supera i 20 MB: guardalo nella tua chat con il bot", "pm_today": "Oggi", "pm_yest": "Ieri", "pm_find": "Cerca per nome", "pm_nofind": "Nessuno trovato", "ch_idea": "idee", "id_h": "Le vostre idee", "id_add": "Cosa dovrebbe aggiungere il club?", "id_add_d": "Dicci cosa manca qui. Il proprietario le legge tutte e dice cosa ne sarà. Sostieni le idee degli altri con la freccia: quelle con più voti si realizzano per prime.", "id_ph": "Ad esempio: un promemoria prima della chiusura di una previsione", "id_send": "Invia", "id_sent": "Inviata. Il proprietario l'ha già ricevuta.", "id_empty": "Scrivi cosa proponi", "id_slow": "Un'idea all'ora. Pensaci su e torna.", "id_none": "Ancora nessuna idea. Sii il primo: vengono lette davvero.", "id_vote": "Sostieni", "id_mark": "Cosa ne sarà", "id_note": "Una riga per l'autore, se serve", "id_soon": "in lavorazione", "id_done": "fatto", "id_no": "per ora no", "id_clear": "Togli il segno", "id_del_q": "L'idea e i suoi voti spariranno.", "fs_h": "Dimensione del testo", "fs0": "Normale", "fs1": "Grande", "fs2": "Molto grande", "lt_calc" // одинаковый на всех телефонах и ничего не надо грузить. Айфон разрешает
// звук только после первого касания экрана, поэтому включаем его по касанию.
let ACX=null;
function sndUnlock(){if(ACX)return;try{const A=window.AudioContext||window.webkitAudioContext;if(A)ACX=new A()}catch(e){}}
try{document.addEventListener('touchstart',sndUnlock,{once:true,passive:true});document.addEventListener('click',sndUnlock,{once:true})}catch(e){}
function ding(){
  if(S.snd===0)return;
  try{
    if(ACX){
      if(ACX.state==='suspended')ACX.resume();
      const t0=ACX.currentTime;
      [[880,0],[1320,.1]].forEach(([f,d])=>{
        const o=ACX.createOscillator(),g=ACX.createGain();o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(0.0001,t0+d);g.gain.exponentialRampToValueAtTime(0.16,t0+d+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001,t0+d+0.24);
        o.connect(g);g.connect(ACX.destination);o.start(t0+d);o.stop(t0+d+0.26)});
    }
  }catch(e){}
  // В Telegram телефон заодно коротко вибрирует
  try{const w=window.Telegram&&Telegram.WebApp;if(w&&w.HapticFeedback)w.HapticFeedback.notificationOccurred('success')}catch(e){}
}

function embUpload(inp){
  const f=inp.files&&inp.files[0];if(!f)return;inp.value='';
  if(!live()){toast(t('tg_need'));return}
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const c=document.createElement('canvas');c.width=c.height=128;
    const m=Math.min(im.width,im.height);
    c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);
    srv('/clans',{act:'embimg',img:c.toDataURL('image/jpeg',.82)},j=>{
      if(j&&j.error){toast(j.error==='notowner'?t('emb_owner'):j.error==='locked'?t('emb_locked'):t('emb_bad'));return}
      toast(t('emb_ok'));srvClans('')})};
    im.onerror=()=>toast(t('emb_bad'));im.src=r.result};
  r.readAsDataURL(f);
}

function pmBubble(m,prev,next){
  const me=m.uid===SRVID,med=m.kind==='photo'||m.kind==='video';
  const near=(a,b)=>a&&b&&a.uid===b.uid&&Math.abs(b.at-a.at)<300000;
  const first=!near(prev,m),last=!near(m,next);
  const day=!prev||new Date(prev.at).toDateString()!==new Date(m.at).toDateString()
    ? `<div class="pmday"><span>${pmDay(m.at)}</span></div>` : '';
  const tick=me?`<i class="tk${m.seen?' on':''}">${m.seen?'✓✓':'✓'}</i>`:'';
  const time=`<span class="ts">${m.ed?`<em class="ed">${t('pm_edited')}</em>`:''}${hm(m.at)}${tick}</span>`;
  // Удалить, исправить, скопировать и поставить смайлик — долгим нажатием
  // на сообщение (на компьютере — правой кнопкой), как в любом мессенджере
  const lpA=m.id?` ontouchstart="lpStart(event,()=>pmMsgMenu(${m.id}))" ontouchend="lpEnd()" ontouchmove="lpEnd()" oncontextmenu="event.preventDefault();pmMsgMenu(${m.id})"`:'';
  return `${day}<div class="pmr ${me?'me':''}${first?' f':''}${last?' l':''}${PMEDIT===m.id?' editing':''}">
    <div class="pmm${med?' med':''}"${lpA}>${pmMedia(m)}${m.text?`<span class="b">${esc(m.text)}</span>`:''}${time}</div></div>
    ${reHtml(m.re,me,`pmReact(${m.id},'§')`)}`;
}
function pmDay(ms){

  const same=(a,b)=>a.toDateString()===b.toDateString();
  if(same(d,n))return t('pm_today');
  const y=new Date(n-86400000);
  if(same(d,y))return t('pm_yest');
  return d.toLocaleDateString(LOC[S.lang],{day:'numeric',month:'long'});

// Запись голосового. Разрешение на микрофон спрашивает сам телефон.
function recStart(){
  if(PMREC)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){toast(t('pm_nomic'));return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
    let mr;
    try{mr=new MediaRecorder(st)}catch(e){try{mr=new MediaRecorder(st,{mimeType:'audio/webm'})}catch(x){st.getTracks().forEach(t=>t.stop());toast(t('pm_nomic'));return}}
    const parts=[];
    mr.ondataavailable=e=>{if(e.data&&e.data.size)parts.push(e.data)};
    mr.onstop=()=>{
      st.getTracks().forEach(t=>t.stop());
      const keep=PMREC&&PMREC.keep,secs=Math.round((Date.now()-PMRECT)/1000);
      PMREC=null;clearInterval(PMRECI);
      if(!keep||!parts.length){renderPm();return}
      const blob=new Blob(parts,{type:mr.mimeType||'audio/webm'});
      if(blob.size<1200){toast(t('pm_short'));renderPm();return}
      pmFile(blob,'voice',mr.mimeType||'audio/webm',secs);
    };
    PMREC={mr:mr,keep:false};PMRECT=Date.now();
    mr.start();renderPm();
    PMRECI=setInterval(()=>{
      const e=$('rectime');if(!e)return;
      const x=Math.round((Date.now()-PMRECT)/1000);
      e.textContent=Math.floor(x/60)+':'+String(x%60).padStart(2,'0');
      if(x>=120)recStop(1); // две минуты — предел, дальше это уже не голосовое
    },500);
  }).catch(()=>toast(t('pm_nomic')));
}
function recStop(keep){
  if(!PMREC)return;
  PMREC.keep=!!keep;
  try{PMREC.mr.stop()}catch(e){PMREC=null;clearInterval(PMRECI);renderPm()}
}
